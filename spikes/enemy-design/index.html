<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enemy Design Sheet</title>
<style>
  :root { --bg: #0b1112; --panel: #141c1e; --text: #c9d1d0; --muted: #7d8a89; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header button { background: #22302f; color: var(--text); border: 1px solid #2f3f3e; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  header label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  header output { min-width: 32px; color: var(--text); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; padding: 12px 16px; }
  figure { margin: 0; background: #10181a; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  figcaption { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  figure canvas { width: 100%; display: block; }
  main.game { display: flex; flex-wrap: wrap; }
  h2 { font-size: 13px; font-weight: 600; margin: 4px 16px 0; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  figure img { width: 100%; height: auto; max-height: 360px; object-fit: contain; display: block; border-radius: 4px; image-rendering: pixelated; }
  #palette { display: none; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px; background: var(--panel); }
  body.with-palette #palette { display: flex; }
  #palette label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  #palette label.edited { color: var(--text); font-weight: 600; }
  #palette input { width: 28px; height: 20px; border: 0; padding: 0; background: none; }
  .kinds { display: flex; border: 1px solid #2f3f3e; border-radius: 4px; overflow: hidden; }
  .kinds label { padding: 4px 10px; cursor: pointer; color: var(--muted); }
  .kinds input { display: none; }
  .kinds label:has(input:checked) { background: #2f4140; color: var(--text); }
  section[hidden], .walkerOnly[hidden], .guardOnly[hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Enemy design sheet</h1>
  <div class="kinds">
    <label><input type="radio" name="kind" value="walker" checked>Gun walker</label>
    <label><input type="radio" name="kind" value="flyer">Flyer</label>
    <label><input type="radio" name="kind" value="guard">Acid guard</label>
  </div>
  <label class="walkerOnly">Brightness <input id="brightness" type="range" min="0.4" max="1.6" step="0.01"><output id="brightnessOut"></output></label>
  <label class="walkerOnly">Saturation <input id="saturate" type="range" min="0" max="1" step="0.01"><output id="saturateOut"></output></label>
  <button id="palToggle">Palette</button>
  <button id="resetPal">Reset overrides</button>
  <button id="copy">Copy palette JSON</button>
  <label><input id="lines" type="checkbox" checked> Outlines</label>
  <label><input id="hero" type="checkbox" checked> Hero beside</label>
  <label class="guardOnly"><input id="guides" type="checkbox" checked> Level guides</label>
</header>
<div id="palette"></div>
<section data-kind="walker">
<main>
  <figure><figcaption>Enemy, front</figcaption><canvas id="front" data-w="640" data-h="780"></canvas></figure>
  <figure><figcaption>Enemy, side, carry</figcaption><canvas id="side" data-w="640" data-h="780"></canvas></figure>
  <figure><figcaption>Enemy, back</figcaption><canvas id="back" data-w="640" data-h="780"></canvas></figure>
  <figure><figcaption>Enemy, explosion</figcaption><canvas id="blastWalker" data-w="640" data-h="780"></canvas></figure>
  <figure><figcaption>Enemy, wreck</figcaption><canvas id="wreckWalker" data-w="640" data-h="780"></canvas></figure>
  <figure class="heroOnly"><figcaption>Hero, side, carry</figcaption><canvas id="heroSide" data-w="640" data-h="780"></canvas></figure>
</main>
<h2>In-game, simplified (game size, scale 0.2, sandbox backdrop)</h2>
<main class="game">
  <figure><figcaption>Face-off, side</figcaption><canvas id="gDuel" data-w="1200" data-h="780"></canvas></figure>
  <figure><figcaption>Enemy, front</figcaption><canvas id="gFront" data-w="640" data-h="780"></canvas></figure>
  <figure><figcaption>Enemy, back</figcaption><canvas id="gBack" data-w="640" data-h="780"></canvas></figure>
</main>
<!-- originals -->

<main>
  <figure><figcaption>Chrome enemy near, t0231</figcaption><img src="../../docs/research/video/frames-best/L1_t0231_hide_dark_sprite_behind_barrel_chrome_enemy_near.png" alt="chrome enemy near"></figure>

</section>
<section data-kind="flyer" hidden>
<main>
  <figure><figcaption>Flyer, hover</figcaption><canvas id="flyerHover" data-w="1000" data-h="420"></canvas></figure>
  <figure><figcaption>Flyer, firing</figcaption><canvas id="flyerFire" data-w="1000" data-h="420"></canvas></figure>
  <figure><figcaption>Flyer, explosion (no wreck)</figcaption><canvas id="flyerBlast" data-w="1000" data-h="900"></canvas></figure>
  <figure class="heroOnly"><figcaption>Scale, hero and low flyer</figcaption><canvas id="flyerScale" data-w="1700" data-h="900"></canvas></figure>
</main>

<main class="game">
  <figure><figcaption>Face-off, low and high flyer</figcaption><canvas id="gFlyer" data-w="1700" data-h="1700"></canvas></figure>
</main>

<section data-kind="guard" hidden>
<main>
  <figure><figcaption>Acid guard, front</figcaption><canvas id="guardFront" data-w="1300" data-h="1400"></canvas></figure>
  <figure><figcaption>Acid guard, firing</figcaption><canvas id="guardFire" data-w="1300" data-h="1400"></canvas></figure>
  <figure><figcaption>Acid guard, acid (guess)</figcaption><canvas id="guardAcid" data-w="1300" data-h="1400"></canvas></figure>
  <figure><figcaption>Acid guard, wreck</figcaption><canvas id="guardWreck" data-w="1300" data-h="1400"></canvas></figure>
  <figure class="heroOnly"><figcaption>Scale, hero and guard</figcaption><canvas id="guardScale" data-w="2300" data-h="1400"></canvas></figure>
</main>
<h2>In-game, simplified (game size, scale 0.2, sandbox backdrop)</h2>
<main class="game">
  <figure><figcaption>Face-off</figcaption><canvas id="gGuard" data-w="2300" data-h="1400"></canvas></figure>
  <figure><figcaption>Wreck</figcaption><canvas id="gGuardWreck" data-w="1300" data-h="1400"></canvas></figure>
</main>
<!-- originals -->
<h2>References</h2>
<main>
  <figure><figcaption>Guard, LEV1.GRA f9 tiles reassembled</figcaption><img src="../../docs/research/gamedata/png/enemy-sprites/guard_acid_tiles_fixed.png" alt="guard tiles reassembled"></figure>
  <figure><figcaption>Kill clip ZABIJ.ANM, frame 8</figcaption><img src="../../docs/research/gamedata/png/enemy-sprites/guard_clip_walk.png" alt="guard walks in kill clip"></figure>
  <figure><figcaption>Kill clip ZABIJ.ANM, frame 45</figcaption><img src="../../docs/research/gamedata/png/enemy-sprites/guard_clip_fire.png" alt="guard fires in kill clip"></figure>
  <figure><figcaption>Wreck tiles, map M16 columns 113-115</figcaption><img src="../../docs/research/gamedata/png/enemy-sprites/guard_acid_wreck.png" alt="guard wreck tiles"></figure>
</main>
<!-- /originals -->
</section>
<script src="../shared/clock.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/xbot.js"></script>
<script src="../shared/gun.js"></script>
<script src="../shared/env.js"></script>
<script src="../shared/enemies.js"></script>
<script>
const { PALETTE, shade, buildFront, buildSide, buildBack, render, FOOT_Y, LEVELS } = window.XBOT;
const { FLYER, GUARD, GUARD_FRONT, FLYER_PALETTE, GUARD_PALETTE } = window.ENEMIES;

const SKY = ["#1b2629", "#0f1517"];
const HERO_CELLS = 1.9;
const K = (FOOT_Y - Object.fromEntries(LEVELS).head) / (HERO_CELLS * ENV.TILE);
const LOW_FLYER = 32;
const tint = { brightness: 1.1, saturate: 0 };
const overrides = { walker: {}, flyer: {}, guard: {} };
const opts = { lines: true, hero: true, guides: true, kind: "walker" };
const GUIDED = new Set(["guardFront", "guardFire", "guardAcid", "guardWreck", "guardScale"]);

const roots = {
  front: buildFront({ rightArmFirst: true, propBehindArm: true, enemy: true }),
  side: buildSide({ farLimbs: true, propBehindArm: true, enemy: true }),
  back: buildBack({ enemy: true }),
  gFront: buildFront({ lod: true, rightArmFirst: true, propBehindArm: true, enemy: true }),
  gSide: buildSide({ farLimbs: true, propBehindArm: true, lod: true, enemy: true }),
  heroSide: buildSide({ farLimbs: true, propBehindArm: true }),
  gHeroSide: buildSide({ farLimbs: true, propBehindArm: true, lod: true }),
  gBack: buildBack({ lod: true, enemy: true })
};
const hold = GUN.holdPoses(roots.side, roots.front);
const gHold = GUN.holdPoses(roots.gSide, roots.gFront);
const POSES = {
  side: { ...hold.CARRY, ...hold.CARRY_FAR },
  front: { ...hold.FRONT_CARRY, ...hold.FRONT_CARRY_R },
  gSide: { ...gHold.CARRY, ...gHold.CARRY_FAR },
  gFront: { ...gHold.FRONT_CARRY, ...gHold.FRONT_CARRY_R }
};
const SIDE_SHIFT = -150;

const PALETTES = {
  walker: () => ({ ...shade(PALETTE, tint), visor: PALETTE.visor, ...overrides.walker }),
  flyer: () => ({ ...ENV.PALETTE, ...FLYER_PALETTE, ...overrides.flyer }),
  guard: () => ({ ...ENV.PALETTE, ...GUARD_PALETTE, ...overrides.guard })
};
const OWN_KEYS = { walker: Object.keys(PALETTE), flyer: Object.keys(FLYER_PALETTE), guard: Object.keys(GUARD_PALETTE) };

function robot(ctx, { root, pose, hook, barrel, pal, simple, lineW }) {
  render(ctx, root, { pal, pose, lineW, simple, hooks: { [hook]: c => GUN.hook(c, { pal, lineW, simple, barrel }) } });
}

function hero(ctx, { x, floor, lineW, simple }) {
  ctx.save();
  ctx.translate(x - XBOT.SIDE_AX, floor - FOOT_Y);
  robot(ctx, { root: simple ? roots.gHeroSide : roots.heroSide, pose: simple ? POSES.gSide : POSES.side, hook: "hand", pal: PALETTE, simple, lineW });
  ctx.restore();
}

function enemy(ctx, asset, { x, y, state = 0, t, pal, lineW, lod = false, facing = 1 }) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(K * facing, K);
  ENV.draw(ctx, asset, { state, t, palette: pal, lines: lineW, lod });
  ctx.restore();
}

const WALKER_BLAST = (FOOT_Y - Object.fromEntries(LEVELS).head) / 147;

function walkerUnits(ctx, draw) {
  ctx.save();
  ctx.translate(XBOT.SIDE_AX, FOOT_Y);
  ctx.scale(WALKER_BLAST, WALKER_BLAST);
  draw();
  ctx.restore();
}

const walkerScrap = ctx => walkerUnits(ctx, () => ENEMIES.scrap(ctx));

function backdrop(ctx, w, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, SKY[0]);
  g.addColorStop(1, SKY[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
}

function floorLine(ctx, w, y) {
  ctx.fillStyle = "#2a2622";
  ctx.fillRect(0, y, w, 6);
}

function facingLeft(ctx, w, fn) {
  ctx.save();
  ctx.translate(w, 0);
  ctx.scale(-1, 1);
  fn();
  ctx.restore();
}

const VIEWS = {
  walker: {
    front: (ctx, lw, pal) => robot(ctx, { root: roots.front, pose: POSES.front, hook: "handL", barrel: hold.FRONT_BARREL, pal, lineW: lw * 1.4 }),
    side: (ctx, lw, pal) => { ctx.translate(SIDE_SHIFT, 0); robot(ctx, { root: roots.side, pose: POSES.side, hook: "hand", pal, lineW: lw * 1.4 }); },
    back: (ctx, lw, pal) => { render(ctx, roots.back, { pal, lineW: lw * 1.4 }); GUN.slung(ctx, { pal, lineW: lw * 1.4 }); },
    blastWalker: (ctx, lw, pal, w, h, t) => {
      const age = t % ENEMIES.BLAST.loop;
      if (age < ENEMIES.BLAST.hideBody) robot(ctx, { root: roots.side, pose: POSES.side, hook: "hand", pal, lineW: lw * 1.4 });
      else walkerScrap(ctx);
      walkerUnits(ctx, () => ENEMIES.blast(ctx, age));
    },
    wreckWalker: ctx => walkerScrap(ctx),
    heroSide: (ctx, lw) => { ctx.translate(SIDE_SHIFT, 0); robot(ctx, { root: roots.heroSide, pose: POSES.side, hook: "hand", pal: PALETTE, lineW: lw * 1.4 }); },
    gDuel: (ctx, lw, pal, w, h) => {
      backdrop(ctx, w, h);
      ctx.translate(SIDE_SHIFT, 0);
      if (opts.hero) robot(ctx, { root: roots.gHeroSide, pose: POSES.gSide, hook: "hand", pal: PALETTE, simple: true, lineW: lw });
      facingLeft(ctx, w - 2 * SIDE_SHIFT, () => robot(ctx, { root: roots.gSide, pose: POSES.gSide, hook: "hand", pal, simple: true, lineW: lw }));
    },
    gFront: (ctx, lw, pal, w, h) => { backdrop(ctx, w, h); robot(ctx, { root: roots.gFront, pose: POSES.gFront, hook: "handL", barrel: gHold.FRONT_BARREL, pal, simple: true, lineW: lw }); },
    gBack: (ctx, lw, pal, w, h) => { backdrop(ctx, w, h); render(ctx, roots.gBack, { pal, lineW: lw, simple: true }); GUN.slung(ctx, { pal, lineW: lw, simple: true }); }
  },
  flyer: {
    flyerHover: (ctx, lw, pal, w, h, t) => enemy(ctx, FLYER, { x: w / 2, y: h / 2, t, pal, lineW: lw }),
    flyerFire: (ctx, lw, pal, w, h, t) => enemy(ctx, FLYER, { x: w / 2, y: h / 2, state: 1, t, pal, lineW: lw }),
    flyerBlast: (ctx, lw, pal, w, h, t) => enemy(ctx, FLYER, { x: w / 2, y: h / 2, state: 2, t, pal, lineW: lw }),
    flyerScale: (ctx, lw, pal, w, h, t) => {
      const floor = h - 40;
      floorLine(ctx, w, floor);
      hero(ctx, { x: 360, floor, lineW: lw * 1.4 });
      enemy(ctx, FLYER, { x: 1250, y: floor - LOW_FLYER * K, state: 1, t, pal, lineW: lw, facing: -1 });
    },
    gFlyer: (ctx, lw, pal, w, h, t) => {
      backdrop(ctx, w, h);
      const floor = h - 100;
      if (opts.hero) hero(ctx, { x: 360, floor, lineW: lw, simple: true });
      enemy(ctx, FLYER, { x: 1250, y: floor - LOW_FLYER * K, state: 1, t, pal, lineW: lw, lod: true, facing: -1 });
      enemy(ctx, FLYER, { x: 950, y: floor - (LOW_FLYER + 2 * ENV.TILE) * K, t: t + 0.7, pal, lineW: lw, lod: true, facing: -1 });
    }
  },
  guard: {
    guardFire: (ctx, lw, pal, w, h, t) => enemy(ctx, GUARD, { x: 1000, y: h - 50, state: 1, t, pal, lineW: lw }),
    guardAcid: (ctx, lw, pal, w, h, t) => enemy(ctx, GUARD, { x: 1000, y: h - 50, state: 2, t, pal, lineW: lw }),
    guardFront: (ctx, lw, pal, w, h, t) => enemy(ctx, GUARD_FRONT, { x: w / 2, y: h - 50, state: Math.floor(t / 2.8) % 2, t, pal, lineW: lw }),
    guardWreck: (ctx, lw, pal, w, h, t) => enemy(ctx, GUARD, { x: 1000, y: h - 50, state: 3, t, pal, lineW: lw }),
    guardScale: (ctx, lw, pal, w, h, t) => {
      const floor = h - 50;
      floorLine(ctx, w, floor);
      hero(ctx, { x: 360, floor, lineW: lw * 1.4 });
      enemy(ctx, GUARD, { x: w - 150, y: floor, t, pal, lineW: lw });
    },
    gGuard: (ctx, lw, pal, w, h, t) => {
      backdrop(ctx, w, h);
      const floor = h - 50;
      if (opts.hero) hero(ctx, { x: 360, floor, lineW: lw, simple: true });
      enemy(ctx, GUARD, { x: w - 150, y: floor, state: 1, t, pal, lineW: lw, lod: true });
    },
    gGuardWreck: (ctx, lw, pal, w, h, t) => { backdrop(ctx, w, h); enemy(ctx, GUARD, { x: 1000, y: h - 50, state: 3, t, pal, lineW: lw, lod: true }); }
  }
};

function guides(ctx, w, floor) {
  ctx.save();
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = "rgba(63,208,224,0.6)";
  ctx.fillStyle = "rgba(63,208,224,0.8)";
  ctx.lineWidth = 2;
  ctx.font = "24px system-ui";
  for (const [name, y] of ENEMIES.GUARD_LEVELS) {
    const at = floor + y * K;
    ctx.beginPath(); ctx.moveTo(0, at); ctx.lineTo(w, at); ctx.stroke();
    ctx.fillText(name, 8, at - 8);
  }
  ctx.restore();
}

function fit(c, dpr) {
  const w = +c.dataset.w, h = +c.dataset.h;
  c.style.aspectRatio = `${w} / ${h}`;
  if (c.closest(".game")) c.style.width = `${w * 0.2}px`;
  const cw = Math.round(c.clientWidth * dpr), ch = Math.round(c.clientWidth * h / w * dpr);
  if (c.width !== cw) c.width = cw;
  if (c.height !== ch) c.height = ch;
  return [w, h];
}

function draw(t = SPIKE_CLOCK.seconds()) {
  const dpr = devicePixelRatio || 1;
  const pal = PALETTES[opts.kind]();
  for (const fig of document.querySelectorAll(".heroOnly")) fig.hidden = !opts.hero;
  for (const [id, view] of Object.entries(VIEWS[opts.kind])) {
    const c = document.getElementById(id);
    if (c.closest("[hidden]")) continue;
    const [w, h] = fit(c, dpr);
    const ctx = c.getContext("2d");
    ctx.setTransform(c.width / w, 0, 0, c.width / w, 0, 0);
    ctx.clearRect(0, 0, w, h);
    view(ctx, opts.lines ? dpr : 0, pal, w, h, t);
    if (opts.guides && GUIDED.has(id)) guides(ctx, w, h - 50);
  }
}

function animate() {
  draw();
  requestAnimationFrame(animate);
}

const palEl = document.getElementById("palette");
const inputs = {};

function buildPalette() {
  palEl.replaceChildren();
  for (const k in inputs) delete inputs[k];
  for (const k of OWN_KEYS[opts.kind]) {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "color";
    input.oninput = () => { overrides[opts.kind][k] = input.value; draw(); syncPalette(); };
    label.append(input, k);
    palEl.append(label);
    inputs[k] = input;
  }
  syncPalette();
}

const pick = (pal, keys) => Object.fromEntries(keys.map(k => [k, pal[k]]));

function syncPalette() {
  const pal = PALETTES[opts.kind]();
  for (const [k, input] of Object.entries(inputs)) {
    input.value = pal[k];
    input.parentElement.classList.toggle("edited", k in overrides[opts.kind]);
  }
}

function setKind(kind) {
  opts.kind = kind;
  for (const s of document.querySelectorAll("section[data-kind]")) s.hidden = s.dataset.kind !== kind;
  for (const el of document.querySelectorAll(".walkerOnly")) el.hidden = kind !== "walker";
  for (const el of document.querySelectorAll(".guardOnly")) el.hidden = kind !== "guard";
  document.querySelector(`input[name=kind][value=${kind}]`).checked = true;
  if (location.hash.slice(1) !== kind) history.replaceState(null, "", "#" + kind);
  buildPalette();
  draw();
}

for (const key of ["brightness", "saturate"]) {
  const input = document.getElementById(key);
  const out = document.getElementById(key + "Out");
  input.value = tint[key];
  out.value = tint[key].toFixed(2);
  input.oninput = () => { tint[key] = +input.value; out.value = tint[key].toFixed(2); draw(); syncPalette(); };
}

for (const input of document.querySelectorAll("input[name=kind]")) input.onchange = () => setKind(input.value);
document.getElementById("palToggle").onclick = () => document.body.classList.toggle("with-palette");
document.getElementById("resetPal").onclick = () => { overrides[opts.kind] = {}; draw(); syncPalette(); };
document.getElementById("copy").onclick = () => {
  const extra = opts.kind === "walker" ? { tint } : {};
  navigator.clipboard.writeText(JSON.stringify({ kind: opts.kind, ...extra, overrides: overrides[opts.kind], palette: pick(PALETTES[opts.kind](), OWN_KEYS[opts.kind]) }, null, 2));
};
document.getElementById("lines").onchange = e => { opts.lines = e.target.checked; draw(); };
document.getElementById("hero").onchange = e => { opts.hero = e.target.checked; draw(); };
document.getElementById("guides").onchange = e => { opts.guides = e.target.checked; draw(); };
addEventListener("resize", () => draw());
const kindFromHash = () => VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "walker";
addEventListener("hashchange", () => setKind(kindFromHash()));
setKind(kindFromHash());
requestAnimationFrame(animate);
</script>
</body>
</html>
