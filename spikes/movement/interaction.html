<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Interaction</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-category="interaction">
<header>
  <h1>Hero interaction</h1>
  <nav><a href="movement.html">Movement</a> <a href="interaction.html">Interaction</a> <a href="fight.html">Fight</a></nav>
  <div class="weapon" role="group" aria-label="Weapon"><button data-weapon="fists">Fists</button><button data-weapon="gun">Gun</button><button data-weapon="blaster">Blaster</button></div>
  <p>Every move loops forever. Side view facing right unless noted. Click a cutscene cell to open its player.</p>
</header>
<main id="grid"></main>
<dialog id="player">
  <header><h2></h2><button id="close">Close</button></header>
  <div class="stage">
    <div><span class="label">Clone (vector)</span><canvas></canvas></div>
<!-- originals -->
    <div class="refWrap"><span class="label" id="refLabel"></span><img id="ref" alt="original frame"></div>
<!-- /originals -->
  </div>
  <div class="bar">
    <button id="play">Pause</button>
    <button id="restart">Restart</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <span id="time"></span>
    <label>Speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option></select></label>
    <label><input id="loop" type="checkbox" checked> Loop</label>
<!-- originals -->
    <button id="refToggle">Show original</button>
<!-- /originals -->
    <button id="palToggle">Palette</button>
    <button id="copyPal">Copy palette JSON</button>
  </div>
  <div id="palette"></div>
</dialog>
<script src="../shared/clock.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/originals.js"></script>
<script src="../shared/xbot.js"></script>
<script src="../shared/gun.js"></script>
<script src="../shared/eblaster.js"></script>
<script src="../shared/cutscenes.js"></script>
<script src="moves.js"></script>
<script src="player.js"></script>
</body>
</html>
