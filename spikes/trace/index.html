<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace Match Tool</title>
<style>
  :root { --bg: #0b1112; --panel: #141c1e; --text: #c9d1d0; --muted: #7d8a89; --accent: #e8892a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 260px; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 12px; background: var(--panel); }
  header button, header select { background: #22302f; color: var(--text); border: 1px solid #2f3f3e; border-radius: 4px; padding: 3px 8px; }
  header button:hover { border-color: var(--accent); cursor: pointer; }
  #view { position: relative; overflow: hidden; min-height: 0; }
  #c { width: 100%; height: 100%; display: block; cursor: crosshair; }
  aside { background: var(--panel); padding: 10px 12px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  aside h2 { font-size: 11px; margin: 0; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  #score { font-variant-numeric: tabular-nums; white-space: pre; }
  #shapes { display: flex; flex-direction: column; gap: 2px; }
  #shapes div { display: flex; gap: 6px; align-items: center; padding: 2px 4px; border-radius: 3px; cursor: pointer; }
  #shapes div.sel { background: #2a3a39; }
  #shapes span.sw { width: 12px; height: 12px; border-radius: 2px; flex: none; }
  #palette label { display: flex; gap: 6px; align-items: center; }
  #palette input { width: 26px; height: 18px; border: 0; padding: 0; background: none; }
  .help { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <label>Mode <select id="mode"><option value="overlay">Overlay</option><option value="difference">Difference</option><option value="heat">Heatmap</option><option value="vector">Vector only</option></select></label>
  <label>Opacity <input id="opacity" type="range" min="0" max="100" value="60"></label>
  <label><input id="grid" type="checkbox"> Grid</label>
  <label><input id="outlines" type="checkbox" checked> Outlines</label>
  <button id="sample">Sample colours</button>
  <button id="newShape">New shape (N)</button>
  <label>Class <select id="cls"></select></label>
  <button id="dup">Duplicate</button>
  <button id="del">Delete shape</button>
  <button id="up">Raise</button>
  <button id="down">Lower</button>
  <button id="export">Download JSON</button>
  <label class="help">Ref <input id="refFile" type="file" accept="image/*"></label>
  <label class="help">Model <input id="modelFile" type="file" accept="application/json"></label>
</header>
<div id="view"><canvas id="c"></canvas></div>
<aside>
  <h2>Score</h2>
  <div id="score"></div>
  <h2>Palette</h2>
  <div id="palette"></div>
  <h2>Shapes</h2>
  <div id="shapes"></div>
  <div class="help">Drag points to move them. Click a shape to select it. Double-click an edge to add a point. Backspace on a hovered point deletes it. Arrow keys nudge (Shift = 10 px). N starts a new shape: click points, Enter finishes. Scroll to zoom, right-drag to pan.</div>
</aside>
<script>
const params = new URLSearchParams(location.search);
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const ui = Object.fromEntries(["mode", "opacity", "grid", "outlines", "sample", "newShape", "cls", "dup", "del", "up", "down", "export", "refFile", "modelFile", "score", "palette", "shapes"].map(id => [id, document.getElementById(id)]));

const state = {
  img: null,
  model: { ref: "", palette: {}, shapes: [] },
  sel: -1,
  dragVertex: -1,
  hoverVertex: -1,
  drafting: null,
  view: { s: 1, x: 0, y: 0 },
  pan: null,
  heat: null,
  score: null,
  dirty: true
};

const ORANGE = (r, g, b) => {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const v = max / 255, s = max ? (max - min) / max : 0;
  if (s < 0.45 || v < 0.3 || max !== r) return false;
  const h = 60 * (((g - b) / (max - min || 1)) % 6);
  return h >= 8 && h <= 50;
};

function loadImage(src) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = src;
  });
}

function fitView() {
  const r = canvas.getBoundingClientRect();
  const s = Math.min(r.width / state.img.width, r.height / state.img.height) * 0.96;
  state.view = { s, x: (r.width - state.img.width * s) / 2, y: (r.height - state.img.height * s) / 2 };
}

function pathOf(shape) {
  const p = new Path2D();
  shape.points.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y));
  p.closePath();
  return p;
}

function colorOf(shape) {
  return shape.color || state.model.palette[shape.cls] || "#ff00ff";
}

function drawShapes(c) {
  for (const sh of state.model.shapes) {
    c.fillStyle = colorOf(sh);
    c.fill(pathOf(sh));
  }
}

function refPixels() {
  const off = new OffscreenCanvas(state.img.width, state.img.height);
  const oc = off.getContext("2d");
  oc.drawImage(state.img, 0, 0);
  return oc.getImageData(0, 0, off.width, off.height).data;
}

function computeScore() {
  const w = state.img.width, h = state.img.height;
  const ref = state.refData || (state.refData = refPixels());
  const off = new OffscreenCanvas(w, h);
  const oc = off.getContext("2d");
  drawShapes(oc);
  const vec = oc.getImageData(0, 0, w, h).data;
  const heat = new ImageData(w, h);
  let covered = 0, err = 0, orange = 0, missing = 0;
  for (let i = 0; i < vec.length; i += 4) {
    const isOrange = ORANGE(ref[i], ref[i + 1], ref[i + 2]);
    if (isOrange) orange++;
    if (vec[i + 3] > 0) {
      covered++;
      const e = Math.hypot(vec[i] - ref[i], vec[i + 1] - ref[i + 1], vec[i + 2] - ref[i + 2]) / 441.7;
      err += e;
      const k = Math.min(1, e * 2.5);
      heat.data[i] = 255 * k; heat.data[i + 1] = 255 * (1 - k); heat.data[i + 2] = 40; heat.data[i + 3] = 200;
    } else if (isOrange) {
      missing++;
      heat.data[i] = 255; heat.data[i + 1] = 0; heat.data[i + 2] = 255; heat.data[i + 3] = 220;
    }
  }
  state.heat = heat;
  state.score = {
    colourError: covered ? err / covered : 0,
    coveredPx: covered,
    orangePx: orange,
    orangeMissing: orange ? missing / orange : 0
  };
  const hb = new OffscreenCanvas(w, h);
  hb.getContext("2d").putImageData(heat, 0, 0);
  state.heatBitmap = hb;
  ui.score.textContent =
    `colour error   ${(state.score.colourError * 100).toFixed(1)} %\n` +
    `orange missed  ${(state.score.orangeMissing * 100).toFixed(1)} %\n` +
    `covered px     ${covered}\n` +
    `shapes         ${state.model.shapes.length}`;
  return state.score;
}

function sampleColours() {
  const w = state.img.width, h = state.img.height;
  const ref = state.refData || (state.refData = refPixels());
  const off = new OffscreenCanvas(w, h);
  const oc = off.getContext("2d");
  for (const sh of state.model.shapes) {
    oc.clearRect(0, 0, w, h);
    oc.fillStyle = "#fff";
    oc.fill(pathOf(sh));
    const b = bbox(sh.points);
    const x0 = Math.max(0, Math.floor(b.x0)), y0 = Math.max(0, Math.floor(b.y0));
    const x1 = Math.min(w, Math.ceil(b.x1)), y1 = Math.min(h, Math.ceil(b.y1));
    if (x1 <= x0 || y1 <= y0) continue;
    const m = oc.getImageData(x0, y0, x1 - x0, y1 - y0).data;
    const rs = [], gs = [], bs = [];
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) {
      const mi = ((y - y0) * (x1 - x0) + (x - x0)) * 4;
      if (m[mi + 3] < 128) continue;
      const ri = (y * w + x) * 4;
      rs.push(ref[ri]); gs.push(ref[ri + 1]); bs.push(ref[ri + 2]);
    }
    if (!rs.length) continue;
    const med = a => a.sort((p, q) => p - q)[a.length >> 1];
    sh.color = "#" + [med(rs), med(gs), med(bs)].map(v => v.toString(16).padStart(2, "0")).join("");
  }
  changed();
}

function bbox(pts) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) };
}

function changed() {
  state.dirty = true;
  renderList();
}

function render() {
  const r = canvas.getBoundingClientRect();
  const dpr = devicePixelRatio || 1;
  if (canvas.width !== Math.round(r.width * dpr)) { canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#050707";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (!state.img) return;
  if (state.dirty) { computeScore(); state.dirty = false; }
  const v = state.view;
  ctx.setTransform(v.s * dpr, 0, 0, v.s * dpr, v.x * dpr, v.y * dpr);
  ctx.imageSmoothingEnabled = false;
  const mode = ui.mode.value;
  if (mode !== "vector") ctx.drawImage(state.img, 0, 0);
  if (mode === "overlay") { ctx.globalAlpha = ui.opacity.value / 100; drawShapes(ctx); ctx.globalAlpha = 1; }
  if (mode === "difference") { ctx.globalCompositeOperation = "difference"; drawShapes(ctx); ctx.globalCompositeOperation = "source-over"; }
  if (mode === "heat") { ctx.globalAlpha = ui.opacity.value / 100; ctx.drawImage(state.heatBitmap, 0, 0); ctx.globalAlpha = 1; }
  if (mode === "vector") drawShapes(ctx);
  if (ui.grid.checked) drawGrid();
  if (ui.outlines.checked) {
    ctx.lineWidth = 1 / v.s;
    ctx.strokeStyle = "rgba(0,255,255,0.35)";
    for (const sh of state.model.shapes) ctx.stroke(pathOf(sh));
  }
  const sel = state.model.shapes[state.sel];
  if (sel) {
    ctx.lineWidth = 2 / v.s;
    ctx.strokeStyle = "#00ffff";
    ctx.stroke(pathOf(sel));
    sel.points.forEach(([x, y], i) => {
      ctx.fillStyle = i === state.hoverVertex ? "#ffff00" : "#00ffff";
      ctx.fillRect(x - 3 / v.s, y - 3 / v.s, 6 / v.s, 6 / v.s);
    });
  }
  if (state.drafting) {
    ctx.lineWidth = 1.5 / v.s;
    ctx.strokeStyle = "#ffff00";
    ctx.beginPath();
    state.drafting.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke();
  }
}

function drawGrid() {
  const w = state.img.width, h = state.img.height, s = state.view.s;
  const step = s > 2 ? 10 : s > 0.8 ? 50 : 100;
  ctx.lineWidth = 1 / s;
  ctx.font = `${10 / s}px monospace`;
  for (let x = 0; x <= w; x += step) {
    ctx.strokeStyle = x % 100 ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    if (x % 100 === 0) { ctx.fillStyle = "#fff"; ctx.fillText(x, x + 2 / s, 10 / s); }
  }
  for (let y = 0; y <= h; y += step) {
    ctx.strokeStyle = y % 100 ? "rgba(255,255,255,0.12)" : "rgba(255,255,255,0.35)";
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
    if (y % 100 === 0) { ctx.fillStyle = "#fff"; ctx.fillText(y, 2 / s, y - 2 / s); }
  }
}

function toImage(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left - state.view.x) / state.view.s, (e.clientY - r.top - state.view.y) / state.view.s];
}

function nearestVertex(p) {
  const sel = state.model.shapes[state.sel];
  if (!sel) return -1;
  const tol = 8 / state.view.s;
  let best = -1, bd = tol;
  sel.points.forEach(([x, y], i) => { const d = Math.hypot(x - p[0], y - p[1]); if (d < bd) { bd = d; best = i; } });
  return best;
}

function hitShape(p) {
  for (let i = state.model.shapes.length - 1; i >= 0; i--) {
    if (ctx.isPointInPath(pathOf(state.model.shapes[i]), p[0] * state.view.s * (devicePixelRatio || 1) + state.view.x * (devicePixelRatio || 1), p[1] * state.view.s * (devicePixelRatio || 1) + state.view.y * (devicePixelRatio || 1))) return i;
  }
  return -1;
}

function hitShapeLocal(p) {
  const off = new OffscreenCanvas(1, 1).getContext("2d");
  for (let i = state.model.shapes.length - 1; i >= 0; i--) if (off.isPointInPath(pathOf(state.model.shapes[i]), p[0], p[1])) return i;
  return -1;
}

canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("mousedown", e => {
  const p = toImage(e);
  if (e.button === 2) { state.pan = { x: e.clientX, y: e.clientY, vx: state.view.x, vy: state.view.y }; return; }
  if (state.drafting) { state.drafting.push(p.map(Math.round)); return; }
  const vi = nearestVertex(p);
  if (vi >= 0) { state.dragVertex = vi; return; }
  state.sel = hitShapeLocal(p);
  syncCls();
  renderList();
});
window.addEventListener("mousemove", e => {
  if (state.pan) {
    state.view.x = state.pan.vx + e.clientX - state.pan.x;
    state.view.y = state.pan.vy + e.clientY - state.pan.y;
    return;
  }
  if (!state.img) return;
  const p = toImage(e);
  if (state.dragVertex >= 0) {
    state.model.shapes[state.sel].points[state.dragVertex] = p.map(Math.round);
    state.dirty = true;
    return;
  }
  state.hoverVertex = nearestVertex(p);
});
window.addEventListener("mouseup", () => { state.dragVertex = -1; state.pan = null; });
canvas.addEventListener("dblclick", e => {
  const sel = state.model.shapes[state.sel];
  if (!sel || state.drafting) return;
  const p = toImage(e);
  let best = 0, bd = Infinity;
  for (let i = 0; i < sel.points.length; i++) {
    const a = sel.points[i], b = sel.points[(i + 1) % sel.points.length];
    const d = distToSeg(p, a, b);
    if (d < bd) { bd = d; best = i; }
  }
  sel.points.splice(best + 1, 0, p.map(Math.round));
  changed();
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0015);
  state.view.x = mx - (mx - state.view.x) * k;
  state.view.y = my - (my - state.view.y) * k;
  state.view.s *= k;
}, { passive: false });

function distToSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy || 1)));
  return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy);
}

window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const sel = state.model.shapes[state.sel];
  if (e.key === "n" || e.key === "N") { state.drafting = []; return; }
  if (e.key === "Enter" && state.drafting) {
    if (state.drafting.length >= 3) {
      state.model.shapes.push({ id: `s${Date.now().toString(36)}`, cls: ui.cls.value || "o", points: state.drafting });
      state.sel = state.model.shapes.length - 1;
    }
    state.drafting = null;
    changed();
    return;
  }
  if (e.key === "Escape") { state.drafting = null; return; }
  if (!sel) return;
  const step = e.shiftKey ? 10 : 1;
  const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (moves[e.key]) {
    e.preventDefault();
    const [dx, dy] = moves[e.key];
    sel.points = sel.points.map(([x, y]) => [x + dx, y + dy]);
    changed();
  }
  if ((e.key === "Backspace" || e.key === "Delete") && state.hoverVertex >= 0 && sel.points.length > 3) {
    sel.points.splice(state.hoverVertex, 1);
    state.hoverVertex = -1;
    changed();
  }
});

function renderList() {
  ui.shapes.innerHTML = "";
  state.model.shapes.forEach((sh, i) => {
    const d = document.createElement("div");
    if (i === state.sel) d.className = "sel";
    const sw = document.createElement("span");
    sw.className = "sw";
    sw.style.background = colorOf(sh);
    d.append(sw, `${sh.id} · ${sh.cls}`);
    d.onclick = () => { state.sel = i; syncCls(); renderList(); };
    ui.shapes.append(d);
  });
}

function renderPalette() {
  ui.palette.innerHTML = "";
  ui.cls.innerHTML = "";
  for (const [k, v] of Object.entries(state.model.palette)) {
    const l = document.createElement("label");
    const inp = document.createElement("input");
    inp.type = "color";
    inp.value = v;
    inp.oninput = () => { state.model.palette[k] = inp.value; changed(); };
    l.append(inp, k);
    ui.palette.append(l);
    const o = document.createElement("option");
    o.value = o.textContent = k;
    ui.cls.append(o);
  }
}

function syncCls() {
  const sel = state.model.shapes[state.sel];
  if (sel) ui.cls.value = sel.cls;
}

ui.cls.onchange = () => {
  const sel = state.model.shapes[state.sel];
  if (sel) { sel.cls = ui.cls.value; delete sel.color; changed(); }
};
ui.mode.onchange = ui.opacity.oninput = () => {};
ui.sample.onclick = sampleColours;
ui.newShape.onclick = () => { state.drafting = []; };
ui.dup.onclick = () => {
  const sel = state.model.shapes[state.sel];
  if (!sel) return;
  state.model.shapes.push({ ...sel, id: `${sel.id}b`, points: sel.points.map(([x, y]) => [x + 10, y + 10]) });
  state.sel = state.model.shapes.length - 1;
  changed();
};
ui.del.onclick = () => { if (state.sel >= 0) { state.model.shapes.splice(state.sel, 1); state.sel = -1; changed(); } };
ui.up.onclick = () => move(1);
ui.down.onclick = () => move(-1);
function move(d) {
  const i = state.sel, j = i + d, a = state.model.shapes;
  if (i < 0 || j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  state.sel = j;
  changed();
}
ui.export.onclick = () => {
  const blob = new Blob([JSON.stringify(state.model, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (state.model.name || "trace") + ".json";
  a.click();
};
ui.refFile.onchange = async () => {
  const f = ui.refFile.files[0];
  if (f) await setRef(URL.createObjectURL(f));
};
ui.modelFile.onchange = async () => {
  const f = ui.modelFile.files[0];
  if (f) setModel(JSON.parse(await f.text()));
};

async function setRef(src) {
  state.img = await loadImage(src);
  state.refData = null;
  fitView();
  changed();
}

function setModel(m) {
  state.model = { palette: {}, shapes: [], ...m };
  state.sel = -1;
  renderPalette();
  changed();
}

function loop() { render(); requestAnimationFrame(loop); }

window.trace = {
  setModel,
  setRef,
  score: () => computeScore(),
  model: () => state.model,
  sample: sampleColours
};

(async () => {
  const modelUrl = params.get("model");
  if (modelUrl) {
    const m = await (await fetch(modelUrl)).json();
    setModel(m);
    await setRef(params.get("ref") || m.ref);
  } else if (params.get("ref")) {
    setModel({ palette: { o: "#e07a1f", ol: "#f5a344", os: "#9a4512", g: "#3a4448", gl: "#5a676c", gs: "#1f2629", y: "#f2c600", k: "#0d1011" }, shapes: [] });
    await setRef(params.get("ref"));
  }
  window.trace.ready = true;
  loop();
})();
</script>
</body>
</html>
