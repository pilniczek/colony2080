<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD Design Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b1112; --panel: #141c1e; --text: #c9d1d0; --muted: #7d8a89; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  header input[type=number] { width: 56px; }
  h2 { font-size: 13px; font-weight: 600; margin: 4px 16px 0; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; padding: 12px 16px; }
  main.full { grid-template-columns: 1fr; }
  figure { margin: 0; background: #10181a; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  figcaption { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  figure svg { width: 100%; height: auto; display: block; background: #000; }
  figure img { width: 100%; height: auto; display: block; border-radius: 4px; image-rendering: pixelated; }
</style>
</head>
<body>
<header>
  <h1>HUD design sheet</h1>
  <label>Aspect <select id="aspect"><option value="320,240">4:3</option><option value="320,200" selected>16:10</option><option value="356,200">16:9</option><option value="467,200">21:9</option></select></label>
  <label>Weapon <select id="weapon"><option value="0">1 gun</option><option value="1">2 fists</option><option value="2">3 bonus</option></select></label>
  <label><input id="bonus" type="checkbox"> Bonus owned</label>
  <label>Ammo <input id="ammo" type="number" min="0" max="999" value="109"></label>
  <label>Bonus ammo <input id="bonusAmmo" type="number" min="0" max="999" value="12"></label>
  <label>Life <input id="life" type="range" min="0" max="100" value="55"></label>
  <label>Reserve <input id="reserve" type="range" min="0" max="100" value="100"></label>
  <label><input id="running" type="checkbox" checked> Run</label>
  <label>Shields <input id="shields" type="number" min="0" max="5" value="3"></label>
  <label>Item <select id="item"><option value="">empty hand</option><option>PACIDLO</option><option>ELEKTROMAGNET</option></select></label>
</header>
<main class="full">
  <figure><figcaption>Vector HUD</figcaption><div id="big"></div></figure>
</main>
<h2>Side by side</h2>
<main>
  <figure><figcaption>Original, Steam screenshot s3</figcaption><img src="../../docs/research/images/steam-screens/s3.jpg" alt="original HUD"></figure>
  <figure><figcaption>Vector HUD</figcaption><div id="small"></div></figure>
</main>
<h2>References</h2>
<main>
  <figure><figcaption>Street start, bonus slot empty</figcaption><img src="../../docs/research/video/frames-best/L1_t0226_street_start_barrel_hud.png" alt="street start"></figure>
  <figure><figcaption>Top bar, all three weapons</figcaption><img src="../../docs/research/gamedata/png/hud_top_x3.png" alt="top bar"></figure>
  <figure><figcaption>Steam screenshot s0, 16:9</figcaption><img src="../../docs/research/images/steam-screens/s0.jpg" alt="16:9"></figure>
  <figure><figcaption>Steam screenshot s6</figcaption><img src="../../docs/research/images/steam-screens/s6.jpg" alt="s6"></figure>
</main>
<script src="../shared/config.js"></script>
<script src="../shared/xbot.js"></script>
<script src="../shared/gun.js"></script>
<script>
(() => {
const HUD_H = 200;
const READOUT = "#a8844a";
const AMBER = "#ffb21c";
const MONO = "Share Tech Mono, monospace";
const BOLD = "Orbitron, sans-serif";
const $ = (id) => document.getElementById(id);

const DEFS = `<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a08f76"/><stop offset=".1" stop-color="#6e604e"/><stop offset=".5" stop-color="#4b4034"/><stop offset=".85" stop-color="#2f2720"/><stop offset="1" stop-color="#1a1511"/></linearGradient>
  <linearGradient id="barMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a08f76"/><stop offset=".1" stop-color="#6e604e"/><stop offset=".5" stop-color="#54483a"/><stop offset=".85" stop-color="#43392e"/><stop offset="1" stop-color="#352d24"/></linearGradient>
  <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c1712"/><stop offset=".3" stop-color="#4a3e32"/><stop offset=".45" stop-color="#5c4e40"/><stop offset=".75" stop-color="#342a21"/><stop offset="1" stop-color="#17120e"/></linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b09f86"/><stop offset=".45" stop-color="#6e5e4c"/><stop offset="1" stop-color="#3a3027"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".45" stop-color="#bba98f"/><stop offset=".55" stop-color="#5a4d3f"/><stop offset="1" stop-color="#eadfcb"/></linearGradient>
  <linearGradient id="amberFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a85a00"/><stop offset=".45" stop-color="#ffd650"/><stop offset=".6" stop-color="#ffe9a0"/><stop offset="1" stop-color="#a85a00"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff" stop-opacity=".45"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
  <linearGradient id="insetTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".85" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
  <linearGradient id="insetSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset=".04" stop-color="#000" stop-opacity="0"/><stop offset=".96" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
  <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0f08"/><stop offset=".6" stop-color="#3b2214"/><stop offset="1" stop-color="#20160f"/></linearGradient>
  <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffde70"/><stop offset=".5" stop-color="#ff7a10"/><stop offset="1" stop-color="#ff7a10" stop-opacity="0"/></linearGradient>
  <linearGradient id="shieldOn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b87a14"/><stop offset=".22" stop-color="#e2a818"/><stop offset=".5" stop-color="#ffd62a"/><stop offset=".78" stop-color="#e2a818"/><stop offset="1" stop-color="#b87a14"/></linearGradient>
  <linearGradient id="shieldOff" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a3416"/><stop offset=".22" stop-color="#5e5a1c"/><stop offset=".5" stop-color="#6c6a22"/><stop offset=".78" stop-color="#5e5a1c"/><stop offset="1" stop-color="#5a3416"/></linearGradient>
  <pattern id="lampLines" width="1" height="2" patternUnits="userSpaceOnUse"><rect y="1" width="1" height="1" fill="#000" fill-opacity=".3"/></pattern>
  <pattern id="lampRail" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#3a2412"/></pattern>
  <radialGradient id="screwHead" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#e6d8c0"/><stop offset=".45" stop-color="#8a7a64"/><stop offset="1" stop-color="#2e261e"/></radialGradient>
  <pattern id="grid" width="3.2" height="3.2" patternUnits="userSpaceOnUse"><rect width="3.2" height="3.2" fill="#120b05"/><path d="M0 .1H3.2M.1 0V3.2" stroke="#5a360c" stroke-width=".2"/></pattern>
  <pattern id="circuit" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#111a17"/><path d="M1 1H8V5H12M3 13V8H6V11M10 8H13M1 6H4" fill="none" stroke="#24403a" stroke-width=".35"/><circle cx="12" cy="5" r=".55" fill="#2f5249"/><circle cx="6" cy="11" r=".55" fill="#2f5249"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="lifeFill" gradientUnits="userSpaceOnUse" x1="0" y1="77.1" x2="0" y2="181.1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".35" stop-color="#ffd030"/><stop offset=".7" stop-color="#ff8a10"/><stop offset="1" stop-color="#d81c06"/></linearGradient>
  <linearGradient id="bevelUp" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#d8c8ae" stop-opacity=".85"/><stop offset=".4" stop-color="#d8c8ae" stop-opacity=".25"/><stop offset=".6" stop-color="#0e0b08" stop-opacity=".35"/><stop offset="1" stop-color="#0e0b08" stop-opacity=".95"/></linearGradient>
  <linearGradient id="bevelDown" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#0e0b08" stop-opacity=".95"/><stop offset=".4" stop-color="#0e0b08" stop-opacity=".35"/><stop offset=".6" stop-color="#d8c8ae" stop-opacity=".2"/><stop offset="1" stop-color="#d8c8ae" stop-opacity=".75"/></linearGradient>
  <linearGradient id="rodG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3128"/><stop offset=".3" stop-color="#f0e4cc"/><stop offset=".55" stop-color="#8a7a64"/><stop offset="1" stop-color="#1a140f"/></linearGradient>
  <filter id="lampHalo" x="-150%" y="-100%" width="400%" height="300%"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="iconGlow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b"/><feFlood flood-color="#ffb21c" flood-opacity=".6"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="iconDim"><feColorMatrix type="saturate" values=".25"/><feComponentTransfer><feFuncR type="linear" slope=".55"/><feFuncG type="linear" slope=".55"/><feFuncB type="linear" slope=".55"/></feComponentTransfer></filter>
  <filter id="keyHalo" x="-100%" y="-100%" width="300%" height="300%"><feMorphology operator="dilate" radius=".3"/><feGaussianBlur stdDeviation=".7"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".35"/></filter>
  <g id="screw"><circle r="1.15" fill="#120e0b"/><circle r=".9" fill="url(#screwHead)"/><path d="M-.6 .35L.6 -.35" stroke="#2a221a" stroke-width=".3"/><path d="M-.55 .5L.65 -.2" stroke="#e6d8c0" stroke-width=".12" opacity=".6"/></g>
</defs>`;

const HI = "#d8c8ae", LO = "#0e0b08";
const screw = (x, y) => `<use href="#screw" x="${x}" y="${y}"/>`;
const bevel = (x, y, w, h, r, raised = true, lw = .45) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="url(#${raised ? "bevelUp" : "bevelDown"})" stroke-width="${lw}"/>`;
const SIDE = 11, BAR_H = 20.4;
const counter = (x, n) => `<text x="${x}" y="16" font-family="${MONO}" font-size="4.6" fill="${READOUT}">${String(n).padStart(3, "0")}</text>`;

const gridPanel = (x, w) => `<rect x="${x + .4}" y="1.8" width="${w - .8}" height="16.2" rx="1.4" fill="#0b0806"/>
  <rect x="${x + 1}" y="2.4" width="${w - 2}" height="15" rx="1" fill="url(#grid)"/>
  <rect x="${x + 1}" y="2.4" width="${w - 2}" height="15" rx="1" fill="url(#insetTop)"/>
  <rect x="${x + 1}" y="2.4" width="${w - 2}" height="15" rx="1" fill="url(#insetSide)"/>
  <rect x="${x + 1}" y="2.4" width="${w - 2}" height="15" rx="1" fill="url(#glare)"/>
  ${bevel(x + .4, 1.8, w - .8, 16.2, 1.4, false, .35)}`;

const R = 12;
function icon(w, h, paint) {
  const c = document.createElement("canvas");
  c.width = w * R; c.height = h * R;
  const ctx = c.getContext("2d");
  ctx.scale(R, R);
  paint(ctx);
  return c.toDataURL();
}

function findNode(node, name) {
  if (node.name === name) return node;
  for (const kid of node.kids || []) {
    const hit = findNode(kid, name);
    if (hit) return hit;
  }
  return null;
}

const GUN_ICON = { w: 35, h: 14, url: icon(35, 14, (ctx) => {
  ctx.scale(0.1, 0.1);
  ctx.translate(84, 98);
  window.GUN.draw(ctx);
}) };

const FIST_ICON = { w: 20, h: 15, url: icon(20, 15, (ctx) => {
  const fore = findNode(window.XBOT.buildSide(), "fore");
  ctx.scale(15 / 146, 15 / 146);
  ctx.translate(-290, 386);
  ctx.beginPath();
  ctx.rect(290, -386, 194, 146);
  ctx.clip();
  ctx.rotate(-Math.PI / 2);
  window.XBOT.render(ctx, { ...fore, m: null, name: null });
}) };

const GUN = `<image href="${GUN_ICON.url}" x="19" y="2.9" width="${GUN_ICON.w}" height="${GUN_ICON.h}"/>`;
const FIST = `<image href="${FIST_ICON.url}" x="84" y="2.4" width="${FIST_ICON.w}" height="${FIST_ICON.h}"/>`;
const BLASTER = `<g transform="translate(108 5.2)" fill="#7f8b86" stroke="#202826" stroke-width=".3">
  <rect y="1" width="34" height="3" rx=".5"/><rect x="8" y="-1.4" width="14" height="2.4" rx=".5" fill="#3f4a46"/>
  <rect x="5" y="4" width="10" height="2.5"/><rect x="9" y="6.5" width="3" height="4.5" rx=".5"/></g>
  <path d="M143 7.7q8-3 22 0q-14 2.6-22 0z" fill="url(#flame)"/>`;
const HAND = `<g transform="translate(0 2.6)" fill="#f0a818" stroke="#6a4206" stroke-width=".3">
  <path d="M3 13c-2-2-3-4-3-6l1-1 2 2V2.2a1 1 0 0 1 2 0V6V1a1 1 0 0 1 2 0v5V1.6a1 1 0 0 1 2 0V6V3a1 1 0 0 1 2 0v6c0 2.6-1.4 4-3 4z"/></g>`;

function plate(a, b) {
  const w = b - a;
  return `<rect x="${a}" y="0" width="${w}" height="${BAR_H}" rx="1.6" fill="url(#barMetal)"/>
  <path d="M${a + 1.6} .4H${b - 1.6}" stroke="#e8d8bc" stroke-width=".5"/>
  ${bevel(a, 0, w, BAR_H, 1.6, true, .45)}`;
}

function rod(a, b, y) {
  return `<rect x="${a - 1}" y="${y - 1.4}" width="${b - a + 2}" height="2.8" fill="url(#rodG)"/>
  <rect x="${a - 1.8}" y="${y - 1.9}" width="1.4" height="3.8" rx=".4" fill="url(#plate)" stroke="${LO}" stroke-width=".25"/>
  <rect x="${b + .4}" y="${y - 1.9}" width="1.4" height="3.8" rx=".4" fill="url(#plate)" stroke="${LO}" stroke-width=".25"/>`;
}

function topBar(W, s) {
  const edge = 0, gap = 2, pad = 3.5, invW = 46.5, runW = 18, inv = W - edge - pad - invW, run = inv - 2 * pad - gap - runW, badge = run - 52.4 - gap - pad;
  const item = s.item
    ? `<text x="${inv + invW / 2}" y="11.9" text-anchor="middle" font-family="${MONO}" font-size="5.6" fill="${AMBER}" filter="url(#glow)">${s.item}</text>`
    : `<g transform="translate(${inv + 5} 0)">${HAND}</g>`;
  const fixedEnd = badge - (W - 320) - 4 - gap, empty = [fixedEnd + gap, badge - 4 - gap];
  const wide = empty[1] - empty[0] >= 8;
  const gaps = [[0, edge], ...(wide ? [[fixedEnd, empty[0]]] : []), [badge - 4 - gap, badge - 4], [badge + 52.4, badge + 52.4 + gap], [run + runW + pad, inv - pad], [W - edge, W]];
  const plates = gaps.slice(1).map(([a], i) => [gaps[i][1], a]);
  const gridX = edge + 4.4, gridW = plates[0][1] - 4.4 - gridX;
  const emptyScrews = wide ? `${screw(empty[0] + 3, 4.6)}${screw(empty[1] - 3, 4.6)}${screw(empty[0] + 3, 15.4)}${screw(empty[1] - 3, 15.4)}` : "";
  return `<rect x="${edge}" width="${W - 2 * edge}" height="${BAR_H}" fill="#060504"/>
  ${gaps.filter(([a, b]) => b > a).map(([a, b]) => [3.4, 7.8, 12.2, 16.6].map((y) => rod(a, b, y)).join("")).join("")}
  ${plates.map(([a, b]) => plate(a, b)).join("")}
  ${emptyScrews}
  ${gridPanel(gridX, gridW)}
  ${weapon(GUN, s.weapon === 0)}${counter(46.6, s.ammo)}
  ${weapon(FIST, s.weapon === 1)}
  ${s.bonus ? weapon(BLASTER, s.weapon === 2) + counter(134.6, s.bonusAmmo) : ""}
  ${WEAPON_KEYS.slice(0, s.bonus ? 3 : 2).map(([x, label], i) => keyTab(x, label, s.weapon === i)).join("")}
  <rect x="${badge + 3.4}" y="3.8" width="41.2" height="12.8" rx="1.8" fill="#16110d"/>
  <rect x="${badge + 3.4}" y="3.8" width="41.2" height="12.8" rx="1.8" fill="url(#insetTop)"/>
  ${bevel(badge + 3.4, 3.8, 41.2, 12.8, 1.8, false, .45)}
  <text x="${badge + 24}" y="13.9" text-anchor="middle" font-family="${BOLD}" font-weight="900" font-size="7.6" fill="#000" opacity=".7">C2080</text>
  <text x="${badge + 24}" y="13.3" text-anchor="middle" font-family="${BOLD}" font-weight="900" font-size="7.6" fill="url(#chrome)" stroke="#1a140f" stroke-width=".2">C2080</text>
  ${screw(badge + 2.4, 3.2)}${screw(badge + 45.6, 3.2)}${screw(badge + 2.4, 17.2)}${screw(badge + 45.6, 17.2)}
  ${gridPanel(run, runW)}${runText(run + runW / 2)}${keyTab(run + runW / 2, "ALT", s.running)}
  ${gridPanel(inv, invW)}${item}`;
}

function view(W, H) {
  const vw = W - 2 * SIDE, hx = SIDE + vw * 0.43;
  return `<rect x="${SIDE}" y="${BAR_H}" width="${vw}" height="${H - 8 - BAR_H}" fill="url(#sky)"/>
  <g transform="translate(0 ${H - HUD_H})">
  <g transform="scale(${vw / 288} 1) translate(-16 0)" transform-origin="${SIDE} 0">
    <path d="M32 150V112h22v-26h14v34h18v-50h10v40h30v-22h16v58h40v-36h24v-18h12v54h30v-30h20v42h32V150z" fill="#0d0907"/></g>
  <rect x="${SIDE}" y="168" width="${vw}" height="24" fill="#2e271f"/>
  <path d="M${SIDE} 168H${W - SIDE}" stroke="#5a4c3c"/>
  <path d="M${SIDE} 176H${W - SIDE}" stroke="#1d1712" stroke-width=".6" stroke-dasharray="10 4"/>
  <g transform="translate(${hx} 168)">
    <rect x="-6" y="-32" width="12" height="18" rx="3" fill="#e0a830"/><rect x="-4" y="-38" width="8" height="7" rx="1.5" fill="#d29a24"/>
    <rect x="-5" y="-15" width="4" height="15" fill="#c48d1e"/><rect x="1" y="-15" width="4" height="15" fill="#c48d1e"/>
    <rect x="2" y="-27" width="18" height="2.2" fill="#8d9797"/></g>
  <text x="${W / 2}" y="80" text-anchor="middle" font-family="${MONO}" font-size="7" fill="#5c4632">GAME VIEW (placeholder)</text></g>`;
}

const weapon = (content, active) => `<g filter="url(#${active ? "iconGlow" : "iconDim"})">${content}</g>`;

const runText = (x) =>
  `<text x="${x}" y="${(1.8 + TAB.top) / 2 + 5.6 * 0.35}" text-anchor="middle" font-family="${MONO}" font-size="5.6" fill="${READOUT}">RUN</text>`;

const KEY = { y: 181.5, size: 9, font: 6.2 };

function keyBox(x, letter) {
  const { y, size, font } = KEY, base = y + size / 2 + font * 0.36;
  return `<rect x="${x - 0.5}" y="${y - 0.5}" width="${size + 1}" height="${size + 1}" rx="1.3" fill="#0b0806"/>
  <rect x="${x}" y="${y}" width="${size}" height="${size}" rx="1" fill="url(#plate)"/>
  ${bevel(x, y, size, size, 1, true, 0.4)}
  <text x="${x + size / 2 + 0.25}" y="${base + 0.25}" text-anchor="middle" font-family="${BOLD}" font-weight="900" font-size="${font}" fill="${HI}" opacity=".55">${letter}</text>
  <text x="${x + size / 2}" y="${base}" text-anchor="middle" font-family="${BOLD}" font-weight="900" font-size="${font}" fill="#1a140f">${letter}</text>`;
}

const WEAPON_KEYS = [[36.5, "1"], [94, "2"], [125, "3"]];
const TAB = { top: 15.2, bottom: 18.2, r: 0.8, font: 3.4, pad: 1.2 };
const tabWidth = (label) => label.length * TAB.font * 0.7 + 2 * TAB.pad;
const TAB_MIN_W = 1.6 * tabWidth("1");

const letter = (x, y, attrs, label) =>
  `<text x="${x}" y="${y}" text-anchor="middle" font-family="${BOLD}" font-weight="900" font-size="${TAB.font}" ${attrs}>${label}</text>`;

const plainLetter = (x, y, label) => letter(x + 0.2, y + 0.2, `fill="${HI}" opacity=".55"`, label) + letter(x, y, 'fill="#1a140f"', label);

const litLetter = (x, y, label) => letter(x, y, 'fill="#ff2a10" opacity=".55" filter="url(#keyHalo)"', label) +
  letter(x, y, 'fill="#ff4a26" stroke="#7a0a02" stroke-width=".3" paint-order="stroke"', label);

function keyTab(cx, label, active = false) {
  const { top, bottom, r } = TAB;
  const w = Math.max(TAB_MIN_W, tabWidth(label)), a = cx - w / 2, b = cx + w / 2, base = (top + BAR_H) / 2 + TAB.font * 0.36;
  const edge = `M${a} ${bottom}V${top + r}Q${a} ${top} ${a + r} ${top}H${b - r}Q${b} ${top} ${b} ${top + r}V${bottom}`;
  return `<path d="${edge}Z" fill="url(#plate)"/>
  <path d="${edge}" fill="none" stroke="${HI}" stroke-opacity=".55" stroke-width=".35"/>
  ${active ? litLetter(cx, base, label) : plainLetter(cx, base, label)}`;
}
function tube(x, top, w, h, fillH, inner = w - 2.6, paint = "url(#amberFill)") {
  const r = 0;
  return `<rect x="${x - .9}" y="${top - .9}" width="${w + 1.8}" height="${h + 1.8}" fill="url(#plate)"/>
  ${bevel(x - .9, top - .9, w + 1.8, h + 1.8, r, true, .4)}
  <rect x="${x}" y="${top}" width="${w}" height="${h}" rx="${r}" fill="#050403"/>
  ${fillH > 0 ? `<rect x="${x + (w - inner) / 2}" y="${top + h - 1.3 - fillH}" width="${inner}" height="${fillH}" fill="${paint}" filter="url(#glow)"/>` : ""}
  <rect x="${x}" y="${top}" width="${w}" height="${h}" rx="${r}" fill="url(#glass)"/>
  ${bevel(x, top, w, h, r, false, .4)}`;
}

function leftColumn(s) {
  const top = 77.1, h = 104, fill = (h - 2.6) * s.life / 100, y = top + h - 1.3 - fill;
  return `${tube(3.5, top, 4, h, fill, 1.2, "url(#lifeFill)")}
  <path d="M8.7 97.1h1.4M8.7 117.1h1.4M8.7 137.1h1.4M8.7 157.1h1.4" stroke="${LO}" stroke-width=".6"/>
  <path d="M8.7 97.6h1.4M8.7 117.6h1.4M8.7 137.6h1.4M8.7 157.6h1.4" stroke="${HI}" stroke-opacity=".5" stroke-width=".3"/>
  <path d="M0 ${y - 2.5}l3.4 2.5L0 ${y + 2.5}z" fill="#ff3018" filter="url(#glow)"/>
  <path d="M0 ${y - 1.9}l2 1.4" stroke="#ffd0b0" stroke-width=".3"/>
  ${keyBox(1, "E")}`;
}

const LAMP = { x: 3, y: 132.6, w: 5, h: 8.6, pitch: 9.6 };

function shieldLight(x, i, on) {
  const lx = x + LAMP.x, ly = LAMP.y + i * LAMP.pitch, { w, h } = LAMP;
  const body = `<rect x="${lx}" y="${ly}" width="${w}" height="${h}" fill="url(#${on ? "shieldOn" : "shieldOff"})"${on ? ' filter="url(#glow)"' : ""}/>`;
  if (!on) {
    return `${body}
  <rect x="${lx}" y="${ly}" width="${w}" height="${h}" fill="url(#lampLines)"/>
  <path d="M${lx} ${ly + 0.3}h${w}M${lx} ${ly + h - 0.3}h${w}" stroke="#2a2410" stroke-width=".6"/>`;
  }
  const cx = lx + w / 2, mid = ly + h / 2;
  return `${body}
  <path d="M${lx} ${ly + 0.3}h${w}M${lx} ${ly + h - 0.3}h${w}" stroke="#a8781a" stroke-width=".6"/>
  <rect x="${cx - 0.5}" y="${ly + 1.8}" width="1" height="${h - 3.6}" fill="#fff23c"/>
  <rect x="${cx - 0.5}" y="${mid - 1.6}" width="1" height="1" fill="#fffbe8"/>
  <rect x="${cx - 0.5}" y="${mid + 0.4}" width="1" height="1" fill="#fffbe8"/>`;
}

function shieldHalo(x, i) {
  const lx = x + LAMP.x, ly = LAMP.y + i * LAMP.pitch, { w, h } = LAMP;
  return `<rect x="${lx - 0.6}" y="${ly - 0.6}" width="${w + 1.2}" height="${h + 1.2}" rx="1.5" fill="#ffb21c" opacity=".75" filter="url(#lampHalo)" style="mix-blend-mode:screen"/>
  <rect x="${lx + w / 2 - 1}" y="${ly + 1.5}" width="2" height="${h - 3}" fill="#fff6c0" opacity=".6" filter="url(#soft)" style="mix-blend-mode:screen"/>`;
}

function shieldChannel(x) {
  const top = LAMP.y - 1, h = 5 * LAMP.pitch + 1, rail = (rx) =>
    `<rect x="${rx}" y="${top}" width="1" height="${h}" fill="url(#lampRail)"/>`;
  return `<rect x="${x + LAMP.x - 1}" y="${top}" width="${LAMP.w + 2}" height="${h}" fill="#050403"/>
  ${rail(x + LAMP.x - 1)}${rail(x + LAMP.x + LAMP.w)}`;
}

function rightColumn(W, s) {
  const x = W - SIDE, top = 75.6, h = 50, fill = (h - 2.6) * s.reserve / 100;
  const lit = (i) => 4 - i < s.shields;
  const lamps = [0, 1, 2, 3, 4];
  const lights = lamps.map((i) => shieldLight(x, i, lit(i))).join("");
  const halos = lamps.filter(lit).map((i) => shieldHalo(x, i)).join("");
  return `${tube(x + 3.8, top, 3.4, h, fill, 1.2)}
  <rect x="${x + 1}" y="130.2" width="9" height="51.8" rx="1" fill="url(#plate)"/>
  ${bevel(x + 1, 130.2, 9, 51.8, 1, true, .4)}
  ${shieldChannel(x)}
  ${lights}
  ${halos}
  ${keyBox(x + 1, "S")}`;
}


function sidePlates(W, H) {
  return `<rect width="${SIDE}" height="${H - 8}" fill="url(#circuit)"/>
  <rect transform="translate(${W - SIDE} 0)" width="${SIDE}" height="${H - 8}" fill="url(#circuit)"/>`;
}

function hud(W, H, s) {
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${DEFS}
  <rect width="${W}" height="${H}" fill="url(#metalV)"/>
  ${sidePlates(W, H)}
  ${view(W, H)}${topBar(W, s)}<g transform="translate(0 ${H - HUD_H})">${leftColumn(s)}${rightColumn(W, s)}
  <rect y="191.8" width="${W}" height="8.2" fill="url(#metal)"/>
  <path d="M0 192.2H${W}" stroke="${HI}" stroke-opacity=".6" stroke-width=".4"/>
  <path d="M0 199.6H${W}" stroke="${LO}" stroke-width=".8"/>
  <path d="M20 196H${W / 2 - 20}M${W / 2 + 20} 196H${W - 20}" stroke="${LO}" stroke-width=".7"/>
  <path d="M20 196.6H${W / 2 - 20}M${W / 2 + 20} 196.6H${W - 20}" stroke="${HI}" stroke-opacity=".35" stroke-width=".3"/>
  ${screw(W / 2 - 14, 196)}${screw(W / 2 + 14, 196)}</g></svg>`;
}

function state() {
  return {
    weapon: +$("weapon").value,
    bonus: $("bonus").checked,
    ammo: +$("ammo").value,
    bonusAmmo: +$("bonusAmmo").value,
    life: +$("life").value,
    reserve: +$("reserve").value,
    shields: +$("shields").value,
    running: $("running").checked,
    item: $("item").value
  };
}

function draw() {
  const s = state();
  const [W, H] = $("aspect").value.split(",").map(Number);
  $("big").innerHTML = hud(W, H, s);
  $("small").innerHTML = hud(320, HUD_H, s);
}

document.querySelectorAll("header input, header select").forEach((el) => el.addEventListener("input", draw));
draw();
})();
</script>
</body>
</html>
