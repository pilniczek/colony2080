<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HUD Design Sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b1112; --panel: #141c1e; --text: #c9d1d0; --muted: #7d8a89; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  header input[type=number] { width: 56px; }
  h2 { font-size: 13px; font-weight: 600; margin: 4px 16px 0; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; padding: 12px 16px; }
  main.full { grid-template-columns: 1fr; }
  figure { margin: 0; background: #10181a; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  figcaption { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  figure svg { width: 100%; height: auto; display: block; background: #000; }
  figure img { width: 100%; height: auto; display: block; border-radius: 4px; image-rendering: pixelated; }
  .bar { margin: 8px 16px 0; display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; }
  .bar label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  figure canvas { width: 100%; height: auto; display: block; background: #000; }
</style>
</head>
<body>
<header>
  <h1>HUD design sheet</h1>
  <label>Aspect <select id="aspect"><option value="320,240">4:3</option><option value="320,200" selected>16:10</option><option value="356,200">16:9</option><option value="467,200">21:9</option></select></label>
  <label>Weapon <select id="weapon"><option value="0">1 gun</option><option value="1">2 fists</option><option value="2">3 bonus</option></select></label>
  <label><input id="bonus" type="checkbox"> Bonus owned</label>
  <label>Ammo <input id="ammo" type="number" min="0" max="999" value="109"></label>
  <label>Bonus ammo <input id="bonusAmmo" type="number" min="0" max="999" value="12"></label>
  <label>Life <input id="life" type="range" min="0" max="100" value="55"></label>
  <label><input id="running" type="checkbox" checked> Run</label>
  <label><input id="soundOn" type="checkbox" checked> Sound</label>
  <label>Shields <input id="shields" type="number" min="0" max="5" value="3"></label>
  <label>Item <select id="item"><option value="">none</option></select></label>
  <label>Held <select id="held" multiple size="3"></select></label>
  <label>Cursor <input id="cursor" type="number" min="0" max="9" value="0"></label>
  <label>Menu <select id="menu"><option value="pause">pause</option><option value="save">save</option><option value="load">load</option><option value="gameOver">game over</option></select></label>
  <label>Menu cursor <input id="menuCursor" type="number" min="0" max="4" value="1"></label>
  <label><input id="typing" type="checkbox"> Typing</label>
  <label><input id="confirm" type="checkbox"> Confirm</label>
  <label><input id="canLoad" type="checkbox" checked> Save exists</label>
</header>
<main class="full">
  <figure><figcaption>Vector HUD</figcaption><div id="big"></div></figure>
</main>
<h2>Inventory screen</h2>
<main class="full">
  <figure><figcaption>Vector inventory screen</figcaption><div id="inventory"></div></figure>
</main>
<h2>Pause menu and game over</h2>
<main class="full">
  <figure><figcaption>Vector pause menu, save slots, game over</figcaption><div id="menuScreen"></div></figure>
</main>
<!-- originals -->
<main>
  <figure><figcaption>Original pause screen</figcaption><img src="../../docs/research/video/frames-best/L1_t0276_pause_menu_screen.png" alt="original pause"></figure>
  <figure><figcaption>Original menu background</figcaption><img src="../../docs/research/gamedata/png/MENU2_f0.png" alt="original menu background"></figure>
  <figure><figcaption>Original game over</figcaption><img src="../../docs/research/video/frames-best/L1_t0610_KONEC_HRY_after_missile_hit.png" alt="original game over"></figure>
</main>
<!-- /originals -->

<main>
  <figure><figcaption>Original inventory screen</figcaption><img src="../../docs/research/video/frames-best/L1_KkPeK_t0901_inventory_energy10pct_ammo501_extra324.png" alt="original inventory"></figure>
  <figure><figcaption>Original inventory screen, more items</figcaption><img src="../../docs/research/video/frames-best/L1_t0585_inventory_xbot_statistika_screen.png" alt="original inventory, more items"></figure>

<h2>Side by side</h2>
<main>

</main>
<h2>Film looks</h2>
<div class="bar">
  <label><input id="filmScrub" type="checkbox"> Scrub</label>
  <label>Film time <input id="filmTime" type="range" min="0" max="1" step="0.01" value="0.8"></label>
</div>
<main>
  <figure><figcaption>Third person: security camera</figcaption><canvas id="camFilm" width="800" height="450"></canvas><figcaption>Grey-green grade, grain, dead pixels, REC dot and date clock. For shots that watch the robot from outside.</figcaption></figure>
  <figure><figcaption>First person: robot vision</figcaption><canvas id="visionFilm" width="800" height="450"></canvas><figcaption>Full frame, no camera marks: red monochrome, flicker band, fine scanlines, heading tape, scrolling readout, target lock. For shots that show what the robot sees.</figcaption></figure>
</main>
<!-- originals -->
<main>
  <figure><figcaption>Original first person shot, crowbar pickup</figcaption><img src="../../docs/research/gamedata/png/SEBPACID/f011.png" alt="original crowbar pickup"></figure>
  <figure><figcaption>Original first person shot, acid valve</figcaption><img src="../../docs/research/gamedata/png/KYSELINA/f031.png" alt="original acid valve"></figure>

<script src="../shared/env.js"></script>
<script src="../shared/env-props.js"></script>
<script src="../shared/env-machines.js"></script>
<script src="../shared/env-structures.js"></script>
<script src="../shared/env-buildings.js"></script>
<script src="../shared/enemies.js"></script>
<script src="../shared/cutscenes.js"></script>
<script src="../shared/cutscenes/pick-controller.js"></script>
<script src="../shared/cutscenes/pick-crowbar.js"></script>
<script src="../shared/robot-view.js"></script>
<script>
(() => {
const HUD_H = 200;
const READOUT = "#a8844a";
const MONO = "Share Tech Mono, monospace";
const BOLD = "Orbitron, sans-serif";
const $ = (id) => document.getElementById(id);

const DEFS = `<defs>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a08f76"/><stop offset=".1" stop-color="#6e604e"/><stop offset=".5" stop-color="#4b4034"/><stop offset=".85" stop-color="#2f2720"/><stop offset="1" stop-color="#1a1511"/></linearGradient>
  <linearGradient id="barMetal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a08f76"/><stop offset=".1" stop-color="#6e604e"/><stop offset=".5" stop-color="#54483a"/><stop offset=".85" stop-color="#43392e"/><stop offset="1" stop-color="#352d24"/></linearGradient>
  <linearGradient id="metalV" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c1712"/><stop offset=".3" stop-color="#4a3e32"/><stop offset=".45" stop-color="#5c4e40"/><stop offset=".75" stop-color="#342a21"/><stop offset="1" stop-color="#17120e"/></linearGradient>
  <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b09f86"/><stop offset=".45" stop-color="#6e5e4c"/><stop offset="1" stop-color="#3a3027"/></linearGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf0"/><stop offset=".45" stop-color="#bba98f"/><stop offset=".55" stop-color="#5a4d3f"/><stop offset="1" stop-color="#eadfcb"/></linearGradient>
  <linearGradient id="amberFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a85a00"/><stop offset=".45" stop-color="#ffd650"/><stop offset=".6" stop-color="#ffe9a0"/><stop offset="1" stop-color="#a85a00"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".22" stop-color="#fff" stop-opacity=".45"/><stop offset=".38" stop-color="#fff" stop-opacity="0"/><stop offset=".8" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
  <linearGradient id="insetTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".75"/><stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".85" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
  <linearGradient id="insetSide" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset=".04" stop-color="#000" stop-opacity="0"/><stop offset=".96" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
  <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0f08"/><stop offset=".6" stop-color="#3b2214"/><stop offset="1" stop-color="#20160f"/></linearGradient>
  <linearGradient id="shieldOn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b87a14"/><stop offset=".22" stop-color="#e2a818"/><stop offset=".5" stop-color="#ffd62a"/><stop offset=".78" stop-color="#e2a818"/><stop offset="1" stop-color="#b87a14"/></linearGradient>
  <linearGradient id="shieldOff" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a3416"/><stop offset=".22" stop-color="#5e5a1c"/><stop offset=".5" stop-color="#6c6a22"/><stop offset=".78" stop-color="#5e5a1c"/><stop offset="1" stop-color="#5a3416"/></linearGradient>
  <pattern id="lampLines" width="1" height="2" patternUnits="userSpaceOnUse"><rect y="1" width="1" height="1" fill="#000" fill-opacity=".3"/></pattern>
  <pattern id="lampRail" width="1" height="2" patternUnits="userSpaceOnUse"><rect width="1" height="1" fill="#3a2412"/></pattern>
  <radialGradient id="screwHead" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#e6d8c0"/><stop offset=".45" stop-color="#8a7a64"/><stop offset="1" stop-color="#2e261e"/></radialGradient>
  <pattern id="grid" width="3.2" height="3.2" patternUnits="userSpaceOnUse"><rect width="3.2" height="3.2" fill="#120b05"/><path d="M0 .1H3.2M.1 0V3.2" stroke="#5a360c" stroke-width=".2"/></pattern>
  <pattern id="circuit" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#111a17"/><path d="M1 1H8V5H12M3 13V8H6V11M10 8H13M1 6H4" fill="none" stroke="#24403a" stroke-width=".35"/><circle cx="12" cy="5" r=".55" fill="#2f5249"/><circle cx="6" cy="11" r=".55" fill="#2f5249"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="lifeFill" gradientUnits="userSpaceOnUse" x1="0" y1="77.1" x2="0" y2="181.1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".35" stop-color="#ffd030"/><stop offset=".7" stop-color="#ff8a10"/><stop offset="1" stop-color="#d81c06"/></linearGradient>
  <linearGradient id="bevelUp" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#d8c8ae" stop-opacity=".85"/><stop offset=".4" stop-color="#d8c8ae" stop-opacity=".25"/><stop offset=".6" stop-color="#0e0b08" stop-opacity=".35"/><stop offset="1" stop-color="#0e0b08" stop-opacity=".95"/></linearGradient>
  <linearGradient id="bevelDown" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#0e0b08" stop-opacity=".95"/><stop offset=".4" stop-color="#0e0b08" stop-opacity=".35"/><stop offset=".6" stop-color="#d8c8ae" stop-opacity=".2"/><stop offset="1" stop-color="#d8c8ae" stop-opacity=".75"/></linearGradient>
  <linearGradient id="rodG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3128"/><stop offset=".3" stop-color="#f0e4cc"/><stop offset=".55" stop-color="#8a7a64"/><stop offset="1" stop-color="#1a140f"/></linearGradient>
  <filter id="lampHalo" x="-150%" y="-100%" width="400%" height="300%"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="iconGlow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="b"/><feFlood flood-color="#ffb21c" flood-opacity=".6"/><feComposite in2="b" operator="in" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="iconDim"><feColorMatrix type="saturate" values=".25"/><feComponentTransfer><feFuncR type="linear" slope=".55"/><feFuncG type="linear" slope=".55"/><feFuncB type="linear" slope=".55"/></feComponentTransfer></filter>
  <filter id="keyHalo" x="-100%" y="-100%" width="300%" height="300%"><feMorphology operator="dilate" radius=".3"/><feGaussianBlur stdDeviation=".7"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation=".35"/></filter>
  <g id="screw"><circle r="1.15" fill="#120e0b"/><circle r=".9" fill="url(#screwHead)"/><path d="M-.6 .35L.6 -.35" stroke="#2a221a" stroke-width=".3"/><path d="M-.55 .5L.65 -.2" stroke="#e6d8c0" stroke-width=".12" opacity=".6"/></g>
</defs>`;

const HI = "#d8c8ae", LO = "#0e0b08";
const screw = (x, y) => `<use href="#screw" x="${x}" y="${y}"/>`;
const bevel = (x, y, w, h, r, raised = true, lw = .45) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="none" stroke="url(#${raised ? "bevelUp" : "bevelDown"})" stroke-width="${lw}"/>`;
const SIDE = 11, BAR_H = 20.4;
const counter = (x, n) => `<text x="${x}" y="16" text-anchor="end" font-family="${MONO}" font-size="4.6" fill="${READOUT}">${n}</text>`;

const gridPanel = (x, w) => `<rect x="${x + .4}" y="1.8" width="${w - .8}" height="16.2" rx="1.4" fill="#0b0806"/>
  <rect x="${x + 1}" y="2.4" width="${w - 2}" height="15" rx="1" fill="url(#grid)"/>
  <rect x="${x + 1}" y="2.4" width="${w - 2}" height="15" rx="1" fill="url(#insetTop)"/>
  <rect x="${x + 1}" y="2.4" width="${w - 2}" height="15" rx="1" fill="url(#insetSide)"/>
  <rect x="${x + 1}" y="2.4" width="${w - 2}" height="15" rx="1" fill="url(#glare)"/>
  ${bevel(x + .4, 1.8, w - .8, 16.2, 1.4, false, .35)}`;

const R = 12;
function icon(w, h, paint) {
  const c = document.createElement("canvas");
  c.width = w * R; c.height = h * R;
  const ctx = c.getContext("2d");
  ctx.scale(R, R);
  paint(ctx);
  return c.toDataURL();
}

function findNode(node, name) {
  if (node.name === name) return node;
  for (const kid of node.kids || []) {
    const hit = findNode(kid, name);
    if (hit) return hit;
  }
  return null;
}

const GUN_ICON = { w: 35, h: 14, url: icon(35, 14, (ctx) => {
  ctx.scale(0.1, 0.1);
  ctx.translate(84, 98);
  window.GUN.draw(ctx);
}) };

const FIST_ICON = { w: 20, h: 15, url: icon(20, 15, (ctx) => {
  const fore = findNode(window.XBOT.buildSide(), "fore");
  ctx.scale(15 / 146, 15 / 146);
  ctx.translate(-290, 386);
  ctx.beginPath();
  ctx.rect(290, -386, 194, 146);
  ctx.clip();
  ctx.rotate(-Math.PI / 2);
  window.XBOT.render(ctx, { ...fore, m: null, name: null });
}) };

const HAND_SCALE = .8, HAND_DRAWN = { w: 12, h: 13 };
const HAND_BOX = { w: HAND_DRAWN.w * HAND_SCALE, h: HAND_DRAWN.h * HAND_SCALE };
const ITEMS = window.C28_CONFIG.items;
const itemIcon = ({ asset, state = 0, tilt, scale }) => {
  const w = HAND_BOX.w * scale, h = HAND_BOX.h * scale;
  return { w, h, url: icon(w, h, (ctx) => {
    const def = window.ENV.ASSETS.find((a) => a.id === asset), [x0, y0, x1, y1] = def.box, angle = tilt * Math.PI / 180;
    const s = Math.min(w, h) / ((x1 - x0) * Math.cos(angle) + (y1 - y0) * Math.sin(angle));
    ctx.translate(w / 2, h / 2);
    ctx.rotate(-angle);
    ctx.scale(s, s);
    ctx.translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
    window.ENV.draw(ctx, def, { state, lod: false, lines: 1 });
  }) };
};
const ITEM_ICONS = Object.fromEntries(Object.entries(ITEMS).map(([id, item]) => [id, itemIcon(item.icon)]));
for (const [id, item] of Object.entries(ITEMS)) {
  $("item").add(new Option(item.name, id));
  $("held").add(new Option(item.name, id, false, ["crowbar", "holoPlan", "shipPlan", "card"].includes(id)));
}
const READOUT_SIZE = 5.6, MONO_ADVANCE = .54, SLOT = { pad: 3.5, gap: 2, iconW: Math.max(HAND_BOX.w, ...Object.values(ITEMS).map((i) => HAND_BOX.w * i.icon.scale)) };
const INV_W = 2 * SLOT.pad + SLOT.iconW + SLOT.gap + Math.max(...Object.values(ITEMS).map((i) => i.name.length)) * READOUT_SIZE * MONO_ADVANCE;

const GUN = (x) => `<image href="${GUN_ICON.url}" x="${x}" y="2.9" width="${GUN_ICON.w}" height="${GUN_ICON.h}"/>`;
const FIST = (x) => `<image href="${FIST_ICON.url}" x="${x}" y="2.4" width="${FIST_ICON.w}" height="${FIST_ICON.h}"/>`;
const HAND = `<g transform="translate(0 2.6)" fill="#f0a818" stroke="#6a4206" stroke-width=".3">
  <path d="M3 13c-2-2-3-4-3-6l1-1 2 2V2.2a1 1 0 0 1 2 0V6V1a1 1 0 0 1 2 0v5V1.6a1 1 0 0 1 2 0V6V3a1 1 0 0 1 2 0v6c0 2.6-1.4 4-3 4z"/></g>`;

function plate(a, b) {
  const w = b - a;
  return `<rect x="${a}" y="0" width="${w}" height="${BAR_H}" rx="1.6" fill="url(#barMetal)"/>
  <path d="M${a + 1.6} .4H${b - 1.6}" stroke="#e8d8bc" stroke-width=".5"/>
  ${bevel(a, 0, w, BAR_H, 1.6, true, .45)}`;
}

function rod(a, b, y) {
  return `<rect x="${a - 1}" y="${y - 1.4}" width="${b - a + 2}" height="2.8" fill="url(#rodG)"/>
  <rect x="${a - 1.8}" y="${y - 1.9}" width="1.4" height="3.8" rx=".4" fill="url(#plate)" stroke="${LO}" stroke-width=".25"/>
  <rect x="${b + .4}" y="${y - 1.9}" width="1.4" height="3.8" rx=".4" fill="url(#plate)" stroke="${LO}" stroke-width=".25"/>`;
}

function topBar(W, s) {
  const edge = 0, gap = 2, pad = 3.5, invW = INV_W, runW = 18, inv = W - edge - pad - invW, run = inv - 2 * pad - gap - runW, sound = run - 2 * pad - gap - runW;
  const held = s.item ? ITEM_ICONS[s.item] : null, label = held ? ITEMS[s.item].name : "nothing", centre = inv + SLOT.pad + SLOT.iconW / 2;
  const hand = `<g transform="translate(${centre} 9.1) scale(${HAND_SCALE}) translate(${-HAND_DRAWN.w / 2} -9.1)">${HAND}</g>`;
  const art = held ? `<image href="${held.url}" x="${centre - held.w / 2}" y="${9.1 - held.h / 2}" width="${held.w}" height="${held.h}"/>` : hand;
  const item = art + readout((inv + SLOT.pad + SLOT.iconW + SLOT.gap + inv + invW - SLOT.pad) / 2, label);
  const gridX = edge + 4.4, gridW = WEAPON_W.reduce((x, y) => x + y, 0) + (WEAPON_W.length + 1) * WEAPON_GAP;
  const weaponsEnd = gridX + gridW + 4.4, soundPlateStart = sound - pad, badgeEnd = soundPlateStart - gap;
  const badge = (weaponsEnd + gap + badgeEnd) / 2 - 24;
  const gaps = [[0, edge], [weaponsEnd, weaponsEnd + gap], [badgeEnd, soundPlateStart], [sound + runW + pad, run - pad], [run + runW + pad, inv - pad], [W - edge, W]];
  const plates = gaps.slice(1).map(([a], i) => [gaps[i][1], a]);
  const wx = WEAPON_W.map((_, i) => gridX + WEAPON_GAP * (i + 1) + WEAPON_W.slice(0, i).reduce((x, y) => x + y, 0));
  return `<rect x="${edge}" width="${W - 2 * edge}" height="${BAR_H}" fill="#060504"/>
  ${gaps.filter(([a, b]) => b > a).map(([a, b]) => [3.4, 7.8, 12.2, 16.6].map((y) => rod(a, b, y)).join("")).join("")}
  ${plates.map(([a, b]) => plate(a, b)).join("")}
  ${gridPanel(gridX, gridW)}
  ${weapon(GUN(wx[0]), s.weapon === 0)}${counter(wx[0] + WEAPON_W[0], s.ammo)}
  ${weapon(FIST(wx[1]), s.weapon === 1)}

function keyTab(cx, label, active = false) {

  return `<path d="${edge}Z" fill="url(#plate)"/>

function shieldHalo(x, i) {

function trimmed(paint, w, h) {
  const big = document.createElement("canvas");
  big.width = big.height = 2400;
  const bctx = big.getContext("2d");
  bctx.translate(1200, 1200);
  paint(bctx);
  const { data } = bctx.getImageData(0, 0, 2400, 2400);
  let x0 = 2400, y0 = 2400, x1 = 0, y1 = 0;
  for (let y = 0; y < 2400; y++) for (let x = 0; x < 2400; x++) {
    if (data[(y * 2400 + x) * 4 + 3] === 0) continue;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1, k = Math.min(w / bw, h / bh);
  return { w: bw * k, h: bh * k, url: icon(bw * k, bh * k, (ctx) => { ctx.scale(k, k); ctx.drawImage(big, -x0, -y0); }) };
}

const FRONT = window.XBOT.buildFront();
const ROBOT_ART = trimmed((ctx) => { window.XBOT.render(ctx, FRONT); }, INV_BOXES.robot.w, INV_BOXES.robot.h);

function outline(paint, w, h, color) {
  return trimmed((ctx) => {
    const c = document.createElement("canvas");
    c.width = c.height = 2400;
    const sil = c.getContext("2d");
    sil.translate(1200, 1200);
    paint(sil);
    sil.setTransform(1, 0, 0, 1, 0, 0);
    sil.globalCompositeOperation = "source-in";
    sil.fillStyle = color;
    sil.fillRect(0, 0, 2400, 2400);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    for (const [dx, dy] of [[-6, 0], [6, 0], [0, -6], [0, 6], [-4, -4], [4, 4], [-4, 4], [4, -4]]) ctx.drawImage(c, dx, dy);
    ctx.globalCompositeOperation = "destination-out";
    ctx.drawImage(c, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = .18;
    ctx.drawImage(c, 0, 0);
  }, w, h);
}
const BODY_ART = outline((ctx) => { window.XBOT.render(ctx, FRONT); }, 30, 56, INV.stat);

  const ox = (W - 320) / 2, oy = (H - 200) / 2, t = INV_BOXES.title, it = INV_BOXES.item, r = INV_BOXES.robot;
  const shown = [...s.held].reverse()[s.cursor], art = shown && BIG_ITEMS[shown];
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${DEFS}${INV_DEFS}${room(W, H)}
  <g transform="translate(${ox} ${oy})">
  ${img(ROBOT_ART, r.x + (r.w - ROBOT_ART.w) / 2, r.y + r.h - ROBOT_ART.h)}
  ${art ? img(art, it.x + (it.w - art.w) / 2, it.y + (it.h - art.h) / 2) : ""}
  ${listBox(s)}
  ${invBox(t)}${invLabel(t.x + t.w / 2, t.y + 8, 6.6, "C2080")}${invLabel(t.x + t.w / 2, t.y + 15.4, 6.6, "STATISTICS")}
  ${statsBox(s)}${ammoBox(s)}</g></svg>`;
}

const MENU = { back: "#0a1f14", grid: "#5a1a14", over: "#ffffff", overEdge: "#2438d0" };
const MENU_ENTRIES = ["SAVE GAME", "LOAD GAME", "MISSION SELECT"];
const MENU_BOX = { x: 22, y: 60, w: 128, h: 56 };
const SLOT_BOX = { x: 10, y: 8, w: 210, h: 184 };
const SLOT_ROW = 30;
const PICTURE = { w: 40, h: 24 };
const GAME_OVER_CHOICES = ["LOAD LAST SAVE", "RESTART MISSION", "EXIT"];
const CHOICE_BOX = { x: 106, y: 146, w: 108, h: 45 };
const OVER = { x: 160, y: 96, size: 9, stroke: 1.2 };
const LEAVE = "LEAVE? UNSAVED PROGRESS IS LOST  ENTER / ESC";
const SAMPLE_SLOTS = [
  { name: "City - door open", time: "2026-10-20 21:14" },
  null,
  { name: "City - before lift", time: "2026-10-20 21:40" },
  { name: "City", time: "2026-10-19 18:02" },
  null
];

const menuDefs = `<defs><pattern id="menuGrid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 16V0H16" fill="none" stroke="${MENU.grid}" stroke-width=".6"/></pattern>
  <linearGradient id="shot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a2a1c"/><stop offset=".6" stop-color="#1c2420"/><stop offset="1" stop-color="#0d1210"/></linearGradient></defs>`;

function menuBackdrop(W, H) {
  const r = INV_BOXES.robot;
  return `<rect width="${W}" height="${H}" fill="${MENU.back}"/>
  <g transform="translate(${(W - 320) / 2} ${(H - 200) / 2})" style="opacity:.3">${img(ROBOT_ART, r.x + (r.w - ROBOT_ART.w) / 2, r.y + r.h - ROBOT_ART.h)}</g>
  <rect width="${W}" height="${H}" fill="url(#menuGrid)"/>`;
}

const pickRow = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${INV.pick}"/>`;

function pauseMenu(m) {
  const b = MENU_BOX, row = 12;
  const rows = MENU_ENTRIES.map((label, i) => {
    const y = b.y + 16 + i * row, on = i === m.cursor;
    return (on ? pickRow(b.x + 2, y, b.w - 4, row - 1) : "") + invText(b.x + 8, y + row * .66, 6.4, on ? "#fff" : INV.name, label);
  }).join("");
  const ask = m.confirm ? invText(b.x + b.w / 2, b.y + b.h + 9, 5.2, INV.stat, LEAVE, 'text-anchor="middle"') : "";
  return invBox(b) + invLabel(b.x + b.w / 2, b.y + 10, 7.6, "MENU") + rows + ask;
}

function slotList(m) {
  const b = SLOT_BOX;
  const rows = SAMPLE_SLOTS.map((slot, i) => {
    const y = b.y + 16 + i * SLOT_ROW, on = i === m.cursor;
    const typing = on && m.typing && m.screen === "save";
    const name = typing ? "City - before li|" : slot ? slot.name : "EMPTY";
    const picture = slot ? `<rect x="${b.x + b.w - PICTURE.w - 6}" y="${y + 3}" width="${PICTURE.w}" height="${PICTURE.h}" fill="url(#shot)" stroke="${INV.frame}" stroke-width=".5"/>` : "";
    return (on ? pickRow(b.x + 2, y, b.w - 4, SLOT_ROW - 2) : "") +
      invText(b.x + 6, y + 11, 7.2, on ? "#fff" : INV.label, String.fromCharCode(65 + i)) +
      invText(b.x + 18, y + 11, 6, on ? "#fff" : slot ? INV.name : INV.frame, name.toUpperCase()) +
      (slot ? invText(b.x + 18, y + 21, 5, on ? "#fff" : INV.frame, slot.time) : "") + picture;
  }).join("");
  const footer = m.confirm ? "OVERWRITE?  ENTER / ESC" : m.typing ? "TYPE A NAME  ENTER SAVES  ESC BACK" : "ENTER SELECTS  ESC BACK";
  return invBox(b) + invLabel(b.x + b.w / 2, b.y + 10, 7.6, m.screen === "save" ? "SAVE GAME" : "LOAD GAME") + rows +
    invText(b.x + b.w / 2, b.y + b.h - 4, 5.2, m.confirm ? INV.stat : INV.frame, footer, 'text-anchor="middle"');
}

function gameOver(W, H, m) {
  const rows = GAME_OVER_CHOICES.map((label, i) => {
    const y = CHOICE_BOX.y + 4 + i * 13, on = i === m.cursor, off = i === 0 && !m.canLoad;
    return (on ? pickRow(CHOICE_BOX.x + 4, y, CHOICE_BOX.w - 8, 12) : "") + invText(160, y + 8.4, 6.4, on ? "#fff" : off ? INV.frame : INV.name, label, 'text-anchor="middle"');
  }).join("");
  return `<rect width="${W}" height="${H}" fill="url(#shot)"/><rect width="${W}" height="${H}" fill="#000" opacity=".25"/>
  <g transform="translate(${(W - 320) / 2} ${(H - 200) / 2})">
  <rect x="${OVER.x - 9}" y="116" width="18" height="4" fill="#c86a1c"/>
  <text x="${OVER.x}" y="${OVER.y}" text-anchor="middle" font-family="${BOLD}" font-weight="900" font-size="${OVER.size}" letter-spacing="1" fill="${MENU.over}" stroke="${MENU.overEdge}" stroke-width="${OVER.stroke}" stroke-linejoin="miter" paint-order="stroke">GAME OVER</text>
  ${invBox(CHOICE_BOX)}${rows}</g>`;
}

function menuScreen(W, H, m) {
  const ox = (W - 320) / 2, oy = (H - 200) / 2;
  if (m.screen === "gameOver") return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${DEFS}${INV_DEFS}${menuDefs}${gameOver(W, H, m)}</svg>`;
  const body = m.screen === "pause" ? pauseMenu(m) : slotList(m);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">${DEFS}${INV_DEFS}${menuDefs}${menuBackdrop(W, H)}
  <g transform="translate(${ox} ${oy})">${body}</g></svg>`;
}

window.INV_BOXES = INV_BOXES;

function state() {
  return {
    weapon: +$("weapon").value,
    bonus: $("bonus").checked,
    ammo: +$("ammo").value,
    bonusAmmo: +$("bonusAmmo").value,
    life: +$("life").value,
    shields: +$("shields").value,
    running: $("running").checked,
    soundOn: $("soundOn").checked,
    item: $("item").value,
    held: [...$("held").selectedOptions].map((o) => o.value),
    cursor: +$("cursor").value,
    energy: +$("life").value
  };
}

function draw() {
  const s = state();
  const [W, H] = $("aspect").value.split(",").map(Number);
  $("big").innerHTML = hud(W, H, s);
  $("small").innerHTML = hud(320, HUD_H, s);
  s.cursor = Math.max(0, Math.min(s.cursor, s.held.length - 1));
  $("inventory").innerHTML = inventoryScreen(W, H, s);
  const screen = $("menu").value;
  const limit = screen === "pause" || screen === "gameOver" ? 2 : 4;
  $("menuScreen").innerHTML = menuScreen(W, H, { screen, cursor: Math.max(0, Math.min(limit, +$("menuCursor").value)), typing: $("typing").checked, confirm: $("confirm").checked, canLoad: $("canLoad").checked });
}

document.querySelectorAll("header input, header select").forEach((el) => el.addEventListener("input", draw));
draw();
})();
</script>
<script>
(() => {
const HOLD = 0.8;
const $ = (id) => document.getElementById(id);
const { crowbarDoor, pickCrowbar, securityCam } = window.CUTSCENES;
const looks = [
  { canvas: $("camFilm"), film: crowbarDoor, over: (ctx, w, h, t) => securityCam(ctx, w, h, t, crowbarDoor.camera) },
  { canvas: $("visionFilm"), film: pickCrowbar, over: (ctx, w, h, t) => window.ROBOT_VIEW.draw(ctx, w, h, t) }
];

function filmTime(film, seconds) {
  if ($("filmScrub").checked) return +$("filmTime").value * film.duration;
  return Math.min(film.duration, seconds % (film.duration + HOLD));
}

function frame() {
  const seconds = window.SPIKE_CLOCK.seconds();
  for (const { canvas, film, over } of looks) {
    const ctx = canvas.getContext("2d");
    const t = filmTime(film, seconds);
    film.render(ctx, canvas.width, canvas.height, t);
    over(ctx, canvas.width, canvas.height, t);
  }
  requestAnimationFrame(frame);
}

document.fonts.ready.then(() => requestAnimationFrame(frame));
})();
</script>
