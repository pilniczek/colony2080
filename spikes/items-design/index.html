<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Item Sheet</title>
<style>
  :root { --bg: #0b1112; --panel: #141c1e; --card: #10181a; --text: #c9d1d0; --muted: #7d8a89; --accent: #e2701a; --cool: #3fd0e0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  section { margin: 12px 16px; padding: 12px; background: var(--card); border-radius: 6px; }
  section h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
  .cs { color: var(--muted); font-weight: 400; font-style: italic; }
  .tag { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 1px 6px; border-radius: 3px; background: #22302f; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  figure { margin: 0; display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
  figcaption { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  figure canvas { display: block; max-width: 100%; background: #1a1410; border-radius: 4px; }
  figure.ref canvas { image-rendering: pixelated; background: #000; }
  figure.hud canvas { background: #1c120a; }
  figure.crop canvas { image-rendering: pixelated; background: #000; }
  .desc { margin: 0 0 8px; color: var(--muted); max-width: 80ch; }
  .tag.off { background: #3a1e0c; color: var(--accent); }
  .todo { overflow: hidden; color: var(--muted); padding: 8px; border: 1px dashed #2f3f3e; border-radius: 4px; font-size: 11px; }
  .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--cool); margin: 10px 0 4px; }
  figure.hand canvas { background: #141c1e; }
</style>
</head>
<body>
<header>
  <h1>Item sheet</h1>
  <label>Mission <select id="mission"></select></label>
</header>
<div id="sheet"></div>
<script src="../shared/clock.js"></script>
<script src="../shared/config.js"></script>
<script src="../shared/originals.js"></script>
<script src="../shared/xbot.js"></script>
<script src="../shared/gun.js"></script>
<script src="../shared/env.js"></script>
<script src="../shared/env-props.js"></script>
<script src="../shared/env-machines.js"></script>
<script src="../shared/env-structures.js"></script>
<script src="../shared/env-buildings.js"></script>
<script src="../shared/env-vesnice.js"></script>
<script src="../shared/env-jungle.js"></script>
<script src="../shared/env-jeskyne.js"></script>
<script src="../shared/env-jeskyne-terrain.js"></script>
<script src="../shared/env-jeskyne-structures.js"></script>
<script src="../shared/env-jeskyne-clutter.js"></script>
<script src="../shared/env-jeskyne-extra.js"></script>
<script src="../shared/env-vezeni.js"></script>
<script src="../shared/env-vezeni-items.js"></script>
<script src="../shared/env-vezeni-terrain.js"></script>
<script src="../shared/env-vezeni-structures.js"></script>
<script src="../shared/env-vezeni-clutter.js"></script>
<script src="../shared/env-sklad.js"></script>
<script src="../shared/env-sklad-items.js"></script>
<script src="../shared/env-sklad-terrain.js"></script>
<script src="../shared/env-sklad-structures.js"></script>
<script src="../shared/env-sklad-clutter.js"></script>
<script>
const ITEMS = Object.fromEntries(Object.entries(window.C28_CONFIG.items).map(([id, item]) => [item.icon.asset, { id, ...item }]));
const LEVELS = Object.entries(window.C28_CONFIG.levels).map(([id, l]) => ({ id, ...l })).sort((a, b) => a.order - b.order);
const USED_IN = new Map();
for (const l of LEVELS) for (const o of l.objects.objects) if (o.item) USED_IN.set(o.id, [...(USED_IN.get(o.id) ?? []), l]);
const DEFAULT_ICON = { tilt: 0, scale: 1.25 };
const PREVIEW_SHEET = /\/(PR\w+)_sheet\.png$/;
const CROP_H = 150, CROP_W = 560;
const asset = (id) => window.ENV.ASSETS.find((a) => a.id === id);
const $ = (id) => document.getElementById(id);

const HAND_BOX = { w: 12 * .8, h: 13 * .8 };
const SHEET = { cols: 6, cell: [160, 100], crop: [0, 57, 78, 42], frames: 31 };
const REF_SCALE = 4;
const BIG = 8, GAME = 2, HUD = 8;

function canvas(w, h) {
  const c = document.createElement("canvas");
  const dpr = devicePixelRatio || 1;
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  c.style.width = `${w}px`;
  c.style.height = `${h}px`;
  const ctx = c.getContext("2d");
  ctx.scale(dpr, dpr);
  return [c, ctx];
}

function figure(cls, caption, node) {
  const f = document.createElement("figure");
  if (cls) f.className = cls;
  f.append(node);
  const cap = document.createElement("figcaption");
  cap.textContent = caption;
  f.append(cap);
  return f;
}

const VIEWS = ["top", "front", "side"];
const HAND_VIEW = { top: "palm", front: "tips", side: "thumb" };
const RIG_BOX = { x: 18, y: 336, w: 140, h: 210 };
const HAND_BOX_OF = { top: { ...RIG_BOX, y: 394 }, front: RIG_BOX, side: RIG_BOX };
const RIG_PER_UNIT = (window.XBOT.FOOT_Y - 2) / 45.6;
const VIEW_SPAN = 300, HAND_SPAN = 360, HAND_PX = 1.4, PAD = 2;
const EXTRA_STATES = {
  "mesto:craneKey": [1], "vesnice:dynamite": [2],
  "sklad:floppyDisk": [1], "sklad:timeBomb": [1]
};

function todo(text, w, h) {
  const d = document.createElement("div");
  d.className = "todo";
  d.style.width = `${Math.max(w, 60)}px`;
  d.style.height = `${Math.max(h, 40)}px`;
  d.textContent = text;
  return d;
}

const INK_K = 8;
const inks = new Map();

function inkExtent(def, state) {
  const key = `${def.id}:${state}`;
  if (inks.has(key)) return inks.get(key);
  const [x0, y0, x1, y1] = window.ENV.viewBox(def, "side");
  const m = 4;
  const w = Math.ceil((x1 - x0 + 2 * m) * INK_K), h = Math.ceil((y1 - y0 + 2 * m) * INK_K);
  const c = new OffscreenCanvas(w, h);
  const ctx = c.getContext("2d");
  ctx.scale(INK_K, INK_K);
  ctx.translate(m - x0, m - y0);
  window.ENV.draw(ctx, def, { state, lines: 1, view: "side" });
  const px = ctx.getImageData(0, 0, w, h).data;
  let ix0 = w, iy0 = h, ix1 = -1, iy1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (px[(y * w + x) * 4 + 3] > 64) {
    ix0 = Math.min(ix0, x); ix1 = Math.max(ix1, x); iy0 = Math.min(iy0, y); iy1 = Math.max(iy1, y);
  }
  const ink = ix1 < 0 ? [x0, y0, x1, y1] : [ix0 / INK_K + x0 - m, iy0 / INK_K + y0 - m, (ix1 + 1) / INK_K + x0 - m, (iy1 + 1) / INK_K + y0 - m];
  inks.set(key, ink);
  return ink;
}

function guides(ctx, def, state, view, [x0, y0, x1, y1]) {
  const [sx0, sy0, sx1, sy1] = inkExtent(def, state);
  ctx.save();
  ctx.setLineDash([1, 1]);
  ctx.strokeStyle = "rgba(63,208,224,0.6)";
  ctx.lineWidth = 0.25;
  ctx.beginPath();
  if (view === "top") for (const x of [sx0, sx1]) { ctx.moveTo(x, y0 - PAD); ctx.lineTo(x, y1 + PAD); }
  if (view === "front") for (const y of [sy0, sy1]) { ctx.moveTo(x0 - PAD, y); ctx.lineTo(x1 + PAD, y); }
  ctx.stroke();
  ctx.restore();
}

function assetView(def, state, scale, lod, view = "side") {
  const box = window.ENV.viewBox(def, view);
  if (!box) {
    const [x0, y0, x1, y1] = window.ENV.viewBox(def, "side");
    return todo("not drawn yet", (x1 - x0 + 2 * PAD) * scale, (y1 - y0 + 2 * PAD) * scale);
  }
  const [x0, y0, x1, y1] = box;
  const [c, ctx] = canvas((x1 - x0 + 2 * PAD) * scale, (y1 - y0 + 2 * PAD) * scale);
  ctx.scale(scale, scale);
  ctx.translate(PAD - x0, PAD - y0);
  if (!lod) guides(ctx, def, state, view, box);
  window.ENV.draw(ctx, def, { state, lod, lines: 1, view });
  return c;
}

function viewScale(def) {
  const boxes = VIEWS.map((v) => window.ENV.viewBox(def, v)).filter(Boolean);
  const span = Math.max(...boxes.map(([x0, y0, x1, y1]) => Math.max(x1 - x0, y1 - y0)));
  return Math.min(BIG, VIEW_SPAN / (span + 2 * PAD));
}

const handScale = (def) => def.views?.scale ?? 1;

function restDraw(def, state, view) {
  const [x0, y0, x1, y1] = window.ENV.viewBox(def, view);
  const cx = (x0 + x1) / 2, cy = view === "top" ? (y0 + y1) / 2 : 0;
  return (ctx) => {
    ctx.save();
    ctx.scale(RIG_PER_UNIT * handScale(def), RIG_PER_UNIT * handScale(def));
    ctx.translate(-cx, -cy);
    window.ENV.draw(ctx, def, { state, lines: devicePixelRatio || 1, view });
    ctx.restore();
  };
}

function restBounds(root, def, view) {
  const [x0, y0, x1, y1] = window.ENV.viewBox(def, view);
  const cx = (x0 + x1) / 2, cy = view === "top" ? (y0 + y1) / 2 : 0;
  const m = window.XBOT.locate(root, "rest");
  const b = HAND_BOX_OF[view];
  let bx0 = b.x, by0 = b.y, bx1 = b.x + b.w, by1 = b.y + b.h;
  for (const [x, y] of [[x0, y0], [x1, y0], [x1, y1], [x0, y1]]) {
    const p = m.transformPoint(new DOMPoint((x - cx) * RIG_PER_UNIT * handScale(def), (y - cy) * RIG_PER_UNIT * handScale(def)));
    bx0 = Math.min(bx0, p.x - 4); by0 = Math.min(by0, p.y - 4); bx1 = Math.max(bx1, p.x + 4); by1 = Math.max(by1, p.y + 4);
  }
  return [bx0, by0, bx1, by1];
}

function handView(def, state, view) {
  if (!window.ENV.viewBox(def, view)) return todo("not drawn yet", RIG_BOX.w * HAND_PX, RIG_BOX.h * HAND_PX);
  const root = window.XBOT.buildHand({ view: HAND_VIEW[view], pose: "carry", rest: true });
  const [x0, y0, x1, y1] = restBounds(root, def, view);
  const s = Math.min(HAND_PX, HAND_SPAN / (x1 - x0), HAND_SPAN / (y1 - y0));
  const [c, ctx] = canvas((x1 - x0) * s, (y1 - y0) * s);
  ctx.scale(s, s);
  ctx.translate(-x0, -y0);
  window.XBOT.render(ctx, root, { hooks: { rest: restDraw(def, state, view) }, lineW: 1.4 * (devicePixelRatio || 1) });
  return c;
}

function viewsRow(def, state, label) {
  const row = document.createElement("div");
  row.className = "row";
  const scale = viewScale(def);
  for (const view of VIEWS) {
    row.append(figure("", `${label}${view}`, assetView(def, state, scale, false, view)));
    row.append(figure("", `${label}${view} game LOD`, assetView(def, state, GAME, true, view)));
  }
  return row;
}

function hudView(def, { state = 0, tilt, scale }) {
  const w = HAND_BOX.w * scale, h = HAND_BOX.h * scale;
  const [c, ctx] = canvas(w * HUD, h * HUD);
  ctx.scale(HUD, HUD);
  const [x0, y0, x1, y1] = def.box, angle = tilt * Math.PI / 180;
  const s = Math.min(w, h) / ((x1 - x0) * Math.cos(angle) + (y1 - y0) * Math.sin(angle));
  ctx.translate(w / 2, h / 2);
  ctx.rotate(-angle);
  ctx.scale(s, s);
  ctx.translate(-(x0 + x1) / 2, -(y0 + y1) / 2);
  window.ENV.draw(ctx, def, { state, lod: false, lines: 1 });
  return c;
}

const refViews = [];
function refView(preview) {
  const [, , cw, ch] = SHEET.crop;
  const [c, ctx] = canvas(cw * REF_SCALE, ch * REF_SCALE);
  ctx.imageSmoothingEnabled = false;
  const img = new Image();
  const view = { ctx, img, frame: 1, ready: false };
  img.onload = () => { view.ready = true; paintRef(view); };
  img.onerror = () => { ctx.fillStyle = "#7d8a89"; ctx.font = "11px system-ui"; ctx.fillText("missing local preview sheet", 8, 20); };
  img.src = window.ORIGINALS.previewSheet(preview);
  refViews.push(view);
  return figure("ref", `original ${preview}`, c);
}

function paintRef(view) {
  if (!view.ready) return;
  const [sx, sy, cw, ch] = SHEET.crop;
  const col = view.frame % SHEET.cols, row = Math.floor(view.frame / SHEET.cols);
  view.ctx.drawImage(view.img, col * SHEET.cell[0] + sx, row * SHEET.cell[1] + sy, cw, ch, 0, 0, cw * REF_SCALE, ch * REF_SCALE);
}

function cropView(ref) {
  const [x, y, w, h] = ref.crop;
  const k = Math.min(CROP_H / h, CROP_W / w, 4);
  const [c, ctx] = canvas(Math.round(w * k), Math.round(h * k));
  ctx.imageSmoothingEnabled = false;
  const img = new Image();
  img.onload = () => ctx.drawImage(img, x, y, w, h, 0, 0, w * k, h * k);
  img.onerror = () => { ctx.fillStyle = "#7d8a89"; ctx.font = "11px system-ui"; ctx.fillText("missing local file", 8, 20); };
  img.src = `../../${ref.path}`;
  return figure("crop", ref.caption, c);
}

function previewOf(o, item) {
  if (item?.preview) return item.preview;
  const name = o.refs.map((r) => r.path.match(PREVIEW_SHEET)?.[1]).find(Boolean);
  return name;
}

function label(text) {
  const d = document.createElement("div");
  d.className = "label";
  d.textContent = text;
  return d;
}

function tag(text, cls = "") {
  const t = document.createElement("span");
  t.className = `tag ${cls}`;
  t.textContent = text;
  return t;
}

function section(o, mission) {
  const def = asset(o.id);
  const item = ITEMS[o.id];
  const s = document.createElement("section");
  s.id = o.id;
  const h = document.createElement("h3");
  h.append(item?.name ?? o.name);
  const cs = document.createElement("span");
  cs.className = "cs";
  cs.textContent = item?.cs ?? o.csName ?? "";
  const shared = USED_IN.get(o.id).filter((l) => l.id !== mission);
  h.append(cs, tag(`asset ${o.id}`), item ? tag(`item ${item.id}`) : tag("not in game yet", "off"),
    tag(shared.length ? `shared: ${shared.map((l) => l.name).join(", ")}` : "mission only"),
    ...(def?.views ? [tag(`hand scale ${def.views.scale}`)] : []), ...(def?.views?.hands === 2 ? [tag("two hands", "off")] : []));
  const desc = document.createElement("p");
  desc.className = "desc";
  desc.textContent = o.description ?? "";
  s.append(h, desc);
  if (!def) {
    s.append(todo("not drawn yet", 200, 60));
    return s;
  }
  const icon = item?.icon ?? DEFAULT_ICON;
  const shown = icon.state ?? Math.max(0, o.states.findIndex((st) => st !== "hidden"));
  const original = document.createElement("div");
  original.className = "row";
  const preview = previewOf(o, item);
  if (preview && window.ORIGINALS.on) original.append(refView(preview));
  original.append(...o.refs.filter((r) => !PREVIEW_SHEET.test(r.path)).map(cropView));
  if (def.views?.side) original.append(figure("", "on the ground (game)", assetView(def, shown, viewScale(def), false, null)));
  original.append(figure("hud", `hud icon tilt ${icon.tilt}${item ? "" : " (default)"}`, hudView(def, icon)));
  const hand = document.createElement("div");
  hand.className = "row";
  for (const view of VIEWS) hand.append(figure("hand", `${view} on the hand`, handView(def, shown, view)));
  s.append(label("Original and HUD icon"), original, label("Views"), viewsRow(def, shown, ""), label("On the hand"), hand);
  const extra = EXTRA_STATES[`${mission}:${o.id}`] ?? [];
  if (extra.length) {
    s.append(label("Other states"));
    for (const st of extra) s.append(viewsRow(def, st, `${o.states[st]}: `));
  }
  return s;
}

function render() {
  refViews.length = 0;
  const mission = $("mission").value;
  const items = LEVELS.find((l) => l.id === mission).objects.objects.filter((o) => o.item);
  $("sheet").replaceChildren(...items.map((o) => section(o, mission)));
}

{
  const select = $("mission");
  for (const l of LEVELS) {
    const option = document.createElement("option");
    option.value = l.id;
    option.textContent = `${l.order}. ${l.name}`;
    select.append(option);
  }
  select.onchange = render;
}
render();
setInterval(() => {
  if (SPIKE_CLOCK.paused) return;
  for (const v of refViews) {
    v.frame = v.frame % (SHEET.frames - 1) + 1;
    paintRef(v);
  }
}, 100);
</script>
<script src="../shared/url-state.js"></script>
</body>
</html>
