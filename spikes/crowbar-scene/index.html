<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crowbar Scene Spike</title>
<style>
  :root { --bg: #0b1112; --panel: #141c1e; --text: #c9d1d0; --muted: #7d8a89; --accent: #e8892a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: 1fr auto; }
  #stage { display: flex; gap: 8px; padding: 8px; min-height: 0; }
  #stage > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  #stage canvas, #stage img { width: 100%; height: 100%; object-fit: contain; background: #000; min-height: 0; }
  #ref { display: none; image-rendering: pixelated; }
  body.with-ref #ref { display: block; }
  body:not(.with-ref) #refWrap { display: none; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); }
  #bar button { background: #22302f; color: var(--text); border: 1px solid #2f3f3e; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  #bar button:hover { border-color: var(--accent); }
  #scrub { flex: 1; min-width: 160px; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; min-width: 92px; }
  #palette { display: none; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; background: var(--panel); border-top: 1px solid #22302f; }
  body.with-palette #palette { display: flex; }
  #palette label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  #palette input { width: 28px; height: 20px; border: 0; padding: 0; background: none; }
</style>
</head>
<body>
<div id="stage">
  <div><span class="label">Clone (vector)</span><canvas id="c"></canvas></div>
  <div id="refWrap"><span class="label">Original METROPAC.ANM (time-normalised)</span><img id="ref" alt="original frame"></div>
</div>
<div>
  <div id="bar">
    <button id="play">Pause</button>
    <button id="restart">Restart</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <span id="time"></span>
    <label>Speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option></select></label>
    <label><input id="loop" type="checkbox" checked> Loop</label>
    <button id="refToggle">Show original</button>
    <button id="palToggle">Palette</button>
    <button id="copyPal">Copy palette JSON</button>
  </div>
  <div id="palette"></div>
</div>
<script src="../shared/config.js"></script>
<script src="../shared/xbot.js"></script>
<script>
const { buildSide, buildBack, render: renderBot, locate, solve, AX, SIDE_AX, FOOT_Y, PALETTE: BOT_PALETTE } = window.XBOT;
const CFG = window.C28_CONFIG.cutscenes.crowbarDoor;
const W = CFG.stage.width, H = CFG.stage.height, FLOOR = CFG.stage.floorY, SEAM = CFG.stage.doorSeamX;
const DOOR_HALF = CFG.stage.doorHalfWidth;
const DOOR = { x: SEAM - DOOR_HALF, w: 2 * DOOR_HALF, top: 322, bottom: 705 };

const palette = { ...CFG.palette };

const CLIP_START = CFG.clip.start;
const CLIP_END = CFG.clip.end;
const DURATION = CLIP_END - CLIP_START;

const tracks = CFG.tracks;

const ease = {
  linear: t => t,
  in: t => t * t,
  out: t => 1 - (1 - t) * (1 - t),
  inOut: t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2
};

function sample(name, t) {
  const keys = tracks[name];
  if (typeof keys[0][1] === "string") {
    let v = keys[0][1];
    for (const k of keys) if (t >= k[0]) v = k[1];
    return v;
  }
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1, e] = keys[i];
    const [t0, v0] = keys[i - 1];
    if (t < t1) {
      if (t1 === t0) return v1;
      const k = (ease[e] || ease.linear)((t - t0) / (t1 - t0));
      return v0 + (v1 - v0) * k;
    }
  }
  return keys[keys.length - 1][1];
}

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function poly(pts, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  ctx.fill();
}

function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawWorld(t) {
  rect(-2000, -1000, 6000, 3000, palette.tunnel);
  rect(-2000, 120, 6000, 600, palette.wall);
  rect(-2000, -1000, 6000, 1120, palette.ceiling);
  ctx.globalAlpha = 0.07;
  for (let x = 100; x < 1800; x += 420) poly([[x - 18, 118], [x + 18, 118], [x + 130, 720], [x - 130, 720]], palette.lampCone);
  ctx.globalAlpha = 1;
  for (let x = 100; x < 1800; x += 420) rect(x - 22, 104, 44, 12, palette.lamp);

  const gap = sample("gap", t);
  const glow = sample("glow", t);
  poly([[180, 250], [1620, 250], [1650, 280], [1650, 705], [150, 705], [150, 280]], palette.wagon);
  rect(150, 640, 1500, 65, palette.wagonShade);
  rect(150, 560, 1500, 24, palette.stripe);
  poly([[180, 250], [1620, 250], [1650, 280], [150, 280]], palette.wagonShade);
  for (const x of [260, 470, 1110, 1320]) {
    rect(x, 340, 150, 150, palette.window);
    ctx.globalAlpha = 0.6;
    poly([[x + 20, 340], [x + 70, 340], [x + 10, 490], [x - 0, 490]], palette.windowGlint);
    ctx.globalAlpha = 1;
  }

  const { x: dx, w: dw, top, bottom } = DOOR, dh = bottom - top;
  rect(dx, top, dw, dh, palette.interior);
  if (glow > 0) {
    ctx.globalAlpha = 0.55 * glow;
    poly([[dx + 25, top + 8], [dx + dw - 25, top + 8], [dx + dw - 5, bottom], [dx + 5, bottom]], palette.interiorLight);
    ctx.globalAlpha = 0.9 * glow;
    rect(SEAM - 5, top + 8, 8, dh - 8, palette.interior);
    rect(dx + 35, 520, dw - 70, 10, palette.interior);
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.beginPath();
  ctx.rect(dx, top, dw, dh);
  ctx.clip();
  const half = gap / 2;
  drawDoorHalf(dx - half, true);
  drawDoorHalf(SEAM + half, false);
  ctx.restore();
  rect(dx - 10, top - 10, dw + 20, 12, palette.doorFrame);
  rect(dx - 10, top - 10, 10, dh + 10, palette.doorFrame);
  rect(dx + dw, top - 10, 10, dh + 10, palette.doorFrame);

  rect(-2000, 705, 6000, 900, palette.platform);
  rect(-2000, 712, 6000, 12, palette.safety);
  for (let x = -2000; x < 4000; x += 160) rect(x, 724, 4, 900, palette.platformLine);
  rect(-2000, 800, 6000, 3, palette.platformLine);
}

function drawDoorHalf(x, left) {
  const { top, bottom } = DOOR;
  rect(x, top, DOOR_HALF, bottom - top, palette.door);
  rect(left ? x : x + DOOR_HALF - 20, top, 20, bottom - top, palette.doorShade);
  rect(x + 20, top + 38, DOOR_HALF - 40, 120, palette.window);
  ctx.globalAlpha = 0.6;
  poly([[x + 30, top + 38], [x + 50, top + 38], [x + 28, top + 158], [x + 20, top + 158]], palette.windowGlint);
  ctx.globalAlpha = 1;
}

function floorShadow(x, w) {
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = palette.shadow;
  ctx.beginPath();
  ctx.ellipse(x, FLOOR + 4, w, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

const RB = CFG.robot;
const K = RB.scale;
const X = RB.x;
const BAR = CFG.crowbar;
const LINE_W = 1.4;
const STAND = { hipNear: 0, kneeNear: 2, ankleNear: -1.4, hipFar: 0, kneeFar: 2, ankleFar: -1.4 };
const sideRoot = buildSide({ farLimbs: true, propBehindArm: true });
const backRoot = buildBack({ leftArmBehind: true, rightForeBehind: true });

function drawCrowbar(c, reach, w, butt) {
  const t = c.getTransform();
  const lw = LINE_W / Math.sqrt(Math.abs(t.a * t.d - t.b * t.c));
  const len = reach + butt - w * 0.2;
  c.strokeStyle = BOT_PALETTE.mLine;
  c.lineWidth = lw;
  c.save();
  c.translate(reach - w * 0.2, 0);
  c.rotate(-0.9);
  c.fillStyle = palette.crowbarShade;
  c.fillRect(0, -w / 2, w * 2.4, w);
  c.strokeRect(0, -w / 2, w * 2.4, w);
  c.restore();
  c.fillStyle = palette.crowbarShade;
  c.fillRect(-butt, -w / 2, len, w);
  c.fillStyle = palette.crowbar;
  c.fillRect(-butt, -w / 2, len, w * 0.55);
  c.strokeRect(-butt, -w / 2, len, w);
}

function robotMatrix(ax, lean = 0) {
  return new DOMMatrix().translate(X, FLOOR).rotate(lean).scale(K).translate(-ax, -FOOT_Y);
}

function placeRobot(root, m, pose, hooks) {
  ctx.save();
  ctx.transform(m.a, m.b, m.c, m.d, m.e, m.f);
  renderBot(ctx, root, { pose, hooks, lineW: LINE_W });
  ctx.restore();
}

const BAR_TILT = RB.barTilt;
const FAR_GRIP = RB.farGripOffset;
const ORIGIN = new DOMPoint(0, 0);

let farSeed = null;

function drawProfile(t) {
  const pose = { ...STAND, arm: sample("armB", t), fore: sample("foreB", t), armFar: 0, foreFar: 0 };
  const blend = sample("farGrip", t);
  if (blend > 0) {
    const rest = locate(sideRoot, "handFar", pose).transformPoint(ORIGIN);
    const grip = locate(sideRoot, "hand", pose).rotate(BAR_TILT * 180 / Math.PI).transformPoint(new DOMPoint(FAR_GRIP, 0));
    const target = new DOMPoint(rest.x + (grip.x - rest.x) * blend, rest.y + (grip.y - rest.y) * blend);
    farSeed = solve(sideRoot, "handFar", pose, ["armFar", "foreFar"], [[-150, 40], [-120, 10]], target, farSeed);
    Object.assign(pose, farSeed);
  }
  const k = sample("barLen", t);
  const hooks = {
    hand: sample("barShown", t) >= 0.5 ? c => {
      c.save();
      c.rotate(BAR_TILT);
      drawCrowbar(c, BAR.reach * k, BAR.width, BAR.butt * k);
      c.restore();
    } : null
  };
  floorShadow(X, 70);
  placeRobot(sideRoot, robotMatrix(SIDE_AX), pose, hooks);
}

const PULL_ARM = RB.pullArmDeg;
const PULL_FORE = RB.pullForeDeg;

function drawBack(t) {
  const pry = sample("pry", t);
  const pull = { arm: PULL_ARM * pry, fore: PULL_FORE * pry };
  const pose = {
    armL: -12 + pull.arm, foreL: -70 + pull.fore,
    armR: -20 + pull.arm, foreR: -64 + pull.fore
  };
  const m = robotMatrix(AX, -2 * pry);
  const end = locate(backRoot, "handL", pose, m).transformPoint(ORIGIN);
  const fist = locate(backRoot, "handR", pose, m).transformPoint(ORIGIN);
  ctx.save();
  ctx.translate(end.x, end.y);
  ctx.rotate(Math.atan2(fist.y - end.y, fist.x - end.x));
  ctx.scale(K, K);
  drawCrowbar(ctx, BAR.reach, BAR.width, BAR.butt);
  ctx.restore();
  floorShadow(X, 90);
  placeRobot(backRoot, m, pose, {});
}

function render(t) {
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(cw * dpr) || canvas.height !== Math.round(ch * dpr)) {
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const s = Math.min(canvas.width / W, canvas.height / H);
  const ox = (canvas.width - W * s) / 2, oy = (canvas.height - H * s) / 2;
  ctx.save();
  ctx.beginPath();
  ctx.rect(ox, oy, W * s, H * s);
  ctx.clip();
  const z = sample("camZ", t);
  const sh = sample("shake", t);
  const cx = sample("camX", t) + Math.sin(t * 90) * sh * 0.4;
  const cy = sample("camY", t) + Math.cos(t * 77) * sh * 0.4;
  ctx.setTransform(s * z, 0, 0, s * z, ox + (W / 2 - cx * z) * s, oy + (H / 2 - cy * z) * s);
  drawWorld(t);
  if (sample("shot", t) === "C") drawBack(t); else drawProfile(t);
  ctx.restore();
}

const ui = {
  play: document.getElementById("play"),
  restart: document.getElementById("restart"),
  scrub: document.getElementById("scrub"),
  time: document.getElementById("time"),
  speed: document.getElementById("speed"),
  loop: document.getElementById("loop"),
  ref: document.getElementById("ref"),
  refToggle: document.getElementById("refToggle"),
  palToggle: document.getElementById("palToggle"),
  copyPal: document.getElementById("copyPal"),
  palette: document.getElementById("palette")
};

const REF_FRAMES = 62;
const refPath = i => `../../docs/research/gamedata/png/METROPAC/f${String(i).padStart(3, "0")}.png`;
let t = 0, playing = true, last = performance.now(), refFrame = -1;

function syncRef() {
  if (!document.body.classList.contains("with-ref")) return;
  const i = Math.min(REF_FRAMES - 1, 1 + Math.floor((t + CLIP_START) / CLIP_END * (REF_FRAMES - 1)));
  if (i !== refFrame) { refFrame = i; ui.ref.src = refPath(i); }
}

function frame(now) {
  const dt = (now - last) / 1000;
  last = now;
  if (playing) {
    t += dt * parseFloat(ui.speed.value);
    if (t >= DURATION) {
      if (ui.loop.checked) t = 0; else { t = DURATION; setPlaying(false); }
    }
  }
  render(t + CLIP_START);
  syncRef();
  ui.scrub.value = Math.round(t / DURATION * 1000);
  ui.time.textContent = `${t.toFixed(2)}s / ${DURATION.toFixed(1)}s`;
  requestAnimationFrame(frame);
}

function setPlaying(v) {
  playing = v;
  ui.play.textContent = v ? "Pause" : "Play";
}

ui.play.onclick = () => { if (t >= DURATION) t = 0; setPlaying(!playing); };
ui.restart.onclick = () => { t = 0; setPlaying(true); };
ui.scrub.oninput = () => { t = ui.scrub.value / 1000 * DURATION; setPlaying(false); };
ui.refToggle.onclick = () => {
  const on = document.body.classList.toggle("with-ref");
  ui.refToggle.textContent = on ? "Hide original" : "Show original";
  refFrame = -1;
};
ui.palToggle.onclick = () => document.body.classList.toggle("with-palette");
ui.copyPal.onclick = () => navigator.clipboard.writeText(JSON.stringify(palette, null, 2)).then(() => {
  ui.copyPal.textContent = "Copied";
  setTimeout(() => ui.copyPal.textContent = "Copy palette JSON", 1200);
});

for (const key of Object.keys(palette)) {
  const label = document.createElement("label");
  const input = document.createElement("input");
  input.type = "color";
  input.value = palette[key];
  input.oninput = () => { palette[key] = input.value; };
  label.append(input, key);
  ui.palette.append(label);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
