<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Design Sheet</title>
<style>
  :root { --bg: #0b1112; --panel: #141c1e; --text: #c9d1d0; --muted: #7d8a89; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header button { background: #22302f; color: var(--text); border: 1px solid #2f3f3e; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  header label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding: 12px 16px; }
  figure { margin: 0; background: #10181a; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  figcaption { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  figure canvas { width: 100%; aspect-ratio: 640 / 780; display: block; }
  main.game { grid-template-columns: repeat(auto-fill, 144px); }
  main.game canvas { width: 128px; }
  h2 { font-size: 13px; font-weight: 600; margin: 4px 16px 0; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  figure img { width: 100%; height: auto; display: block; border-radius: 4px; image-rendering: pixelated; }
  #refs { padding: 0 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  #palette { display: none; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px; background: var(--panel); }
  body.with-palette #palette { display: flex; }
  #palette label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .hands { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 12px; padding: 8px 16px 12px; align-items: start; }
  h3 { font-size: 12px; font-weight: 600; margin: 8px 16px 0; color: var(--text); text-transform: capitalize; }
  .hands canvas.full { width: 100%; aspect-ratio: 140 / 210; display: block; }
  #carry { padding: 8px 16px 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  #carry figure { margin: 0; flex: 1 1 0; min-width: 200px; }
  #carry canvas { display: block; width: 100%; height: auto; aspect-ratio: auto; }
  .pick { padding: 8px 16px 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .pick figure { margin: 0; flex: 1 1 0; min-width: 200px; }
  .pick canvas { display: block; width: 100%; height: auto; aspect-ratio: auto; }
  #palette input { width: 28px; height: 20px; border: 0; padding: 0; background: none; }
</style>
</head>
<body>
<header>
  <h1>Robot design sheet</h1>
  <button id="palToggle">Palette</button>
  <button id="copyPal">Copy palette JSON</button>
  <label><input id="guides" type="checkbox" checked> Level guides</label>
</header>
<div id="palette"></div>
<main>
  <figure><figcaption>Front</figcaption><canvas id="front"></canvas></figure>
  <figure><figcaption>Side, facing right (robot's right side)</figcaption><canvas id="side"></canvas></figure>
  <figure><figcaption>Side, facing left (robot's left side)</figcaption><canvas id="sideLeft"></canvas></figure>
  <figure><figcaption>Back</figcaption><canvas id="back"></canvas></figure>
  <figure><figcaption>From above, facing up</figcaption><canvas id="top"></canvas></figure>
</main>
<h2>In-game, simplified (game size, scale 0.2)</h2>
<main class="game">
  <figure><figcaption>Front</figcaption><canvas id="gFront"></canvas></figure>
  <figure><figcaption>Side, facing right</figcaption><canvas id="gSide"></canvas></figure>
  <figure><figcaption>Side, facing left</figcaption><canvas id="gSideLeft"></canvas></figure>
  <figure><figcaption>Back</figcaption><canvas id="gBack"></canvas></figure>
  <figure><figcaption>From above</figcaption><canvas id="gTop"></canvas></figure>
</main>
<h2>Hands</h2>
<section id="hands"></section>
<h2>Two hand carry (vesnice projectile)</h2>
<section id="carry">
  <figure><figcaption>Side, upper body</figcaption><canvas id="carrySide"></canvas></figure>
  <figure><figcaption>Front, upper body</figcaption><canvas id="carryFront"></canvas></figure>
  <figure><figcaption>Back, upper body</figcaption><canvas id="carryBack"></canvas></figure>
  <figure><figcaption>From above, upper body</figcaption><canvas id="carryTop"></canvas></figure>
  <figure><figcaption>Robot's own view, looking down</figcaption><canvas id="carryView"></canvas></figure>
</section>
<h2>Pick up (crowbar)</h2>
<section class="pick">
  <figure><figcaption>Side: reach</figcaption><canvas data-pick="side" data-phase="reach"></canvas></figure>
  <figure><figcaption>Side: take</figcaption><canvas data-pick="side" data-phase="take"></canvas></figure>
  <figure><figcaption>Side: bring to the body</figcaption><canvas data-pick="side" data-phase="lift"></canvas></figure>
  <figure><figcaption>Side: whole pick-up</figcaption><canvas data-pick="side"></canvas></figure>
</section>
<section class="pick">
  <figure><figcaption>Robot's own view: reach</figcaption><canvas data-pick="view" data-phase="reach"></canvas></figure>
  <figure><figcaption>Robot's own view: take</figcaption><canvas data-pick="view" data-phase="take"></canvas></figure>
  <figure><figcaption>Robot's own view: bring to the body</figcaption><canvas data-pick="view" data-phase="lift"></canvas></figure>
  <figure><figcaption>Robot's own view: whole pick-up</figcaption><canvas data-pick="view"></canvas></figure>
</section>
<section class="pick">
  <figure><figcaption>Crowbar pointing away, own view: reach</figcaption><canvas data-pick="viewAway" data-phase="reach"></canvas></figure>
  <figure><figcaption>Crowbar pointing away, own view: take</figcaption><canvas data-pick="viewAway" data-phase="take"></canvas></figure>
  <figure><figcaption>Crowbar pointing away, own view: bring to the body</figcaption><canvas data-pick="viewAway" data-phase="lift"></canvas></figure>
  <figure><figcaption>Crowbar pointing away, own view: whole pick-up</figcaption><canvas data-pick="viewAway"></canvas></figure>
</section>
<!-- originals -->
<section id="refs">
  <figure><figcaption>Open hand, POUZRUKU</figcaption><img src="../../docs/research/robot/cutscenes/POUZRUKU_f018_hand.png" alt="open hand"></figure>
  <figure><figcaption>Fist, SUTR</figcaption><img src="../../docs/research/robot/cutscenes/SUTR_f048_hand.png" alt="fist"></figure>
  <figure><figcaption>Box cover</figcaption><img src="../../docs/research/robot/hires/archive_msdos_00cover.jpg" alt="box cover"></figure>
  <figure><figcaption>Front, VSTUP</figcaption><img src="../../docs/research/robot/cutscenes/VSTUP_f100_front.png" alt="front"></figure>
  <figure><figcaption>Front, SKALA3</figcaption><img src="../../docs/research/robot/cutscenes/SKALA3_f081_front.png" alt="front walking"></figure>
  <figure><figcaption>Side, METROPAC</figcaption><img src="../../docs/research/robot/cutscenes/METROPAC_f028_side.png" alt="side"></figure>
  <figure><figcaption>Back, METROPAC</figcaption><img src="../../docs/research/robot/cutscenes/METROPAC_f044_back.png" alt="back"></figure>
  <figure><figcaption>Back, POUZDRAT</figcaption><img src="../../docs/research/robot/cutscenes/POUZDRAT_f030_back.png" alt="back"></figure>
</section>
<!-- /originals -->
<script src="../shared/config.js"></script>
<script src="../shared/xbot.js"></script>
<script src="../shared/env.js"></script>
<script src="../shared/env-props.js"></script>
<script src="../shared/env-vesnice.js"></script>
<script>
const { PALETTE, LEVELS, buildFront, buildSide, buildBack, buildTop, buildHand, HAND_VIEWS, HAND_POSES, render } = window.XBOT;

const pal = { ...PALETTE };
const views = { front: buildFront(), side: buildSide(), sideLeft: buildSide({ badge: true }), back: buildBack(), top: buildTop() };
const gameViews = { gFront: buildFront({ lod: true }), gSide: buildSide({ farLimbs: true, lod: true }), gSideLeft: buildSide({ farLimbs: true, badge: true, lod: true }), gBack: buildBack({ lod: true }), gTop: buildTop({ lod: true }) };
const simple = new Set(Object.keys(gameViews));
Object.assign(views, gameViews);
const mirrored = new Set(["sideLeft", "gSideLeft"]);
const opts = { guides: true };
const TOP_VIEWS = new Set(["top", "gTop"]);

const HAND_BOX = { x: 18, y: 336, w: 140, h: 210 };
const HAND_LABEL = { palm: "Palm", back: "Back", thumb: "Thumb", little: "Little finger", tips: "From the fingertips" };
const HAND_LABEL_POSE = { carry: "Carry on the palm", cup: "Hold a small item", grip: "Grip a crowbar", pinch: "Pinch a key or card", gunGrip: "Gun grip" };
const HAND_ITEMS = { carry: "shipPart", cup: "fuse", grip: "crowbar", pinch: "craneKey" };
const drawItem = id => ctx => window.ENV.draw(ctx, window.ENV.ASSETS.find(a => a.id === id), { state: id === "shipPart" ? 1 : 0, lines: 0.3 });
const hands = [];
const handsEl = document.getElementById("hands");
for (const pose of HAND_POSES) {
  const title = document.createElement("h3");
  title.textContent = HAND_LABEL_POSE[pose] || pose;
  const grid = document.createElement("div");
  grid.className = "hands";
  handsEl.append(title, grid);
  for (const view of HAND_VIEWS) {
    const fig = document.createElement("figure");
    const cap = document.createElement("figcaption");
    cap.textContent = HAND_LABEL[view];
    const full = document.createElement("canvas");
    full.className = "full";
    fig.append(cap, full);
    grid.append(fig);
    hands.push({ full, root: buildHand({ view, pose }), hooks: HAND_ITEMS[pose] ? { item: drawItem(HAND_ITEMS[pose]) } : {} });
  }
}

function drawHands() {
  const dpr = devicePixelRatio || 1;
  for (const { full, root, hooks } of hands) {
    full.width = Math.round(full.clientWidth * dpr);
    full.height = Math.round(full.width * HAND_BOX.h / HAND_BOX.w);
    const scale = full.width / HAND_BOX.w;
    const ctx = full.getContext("2d");
    ctx.setTransform(scale, 0, 0, scale, -HAND_BOX.x * scale, -HAND_BOX.y * scale);
    ctx.clearRect(HAND_BOX.x, HAND_BOX.y, HAND_BOX.w, HAND_BOX.h);
    render(ctx, root, { pal, hooks, lineW: 1.4 * dpr });
  }
}

const CARRY_ITEM = window.ENV.ASSETS.find(a => a.id === "projectile");
const CARRY_K = (window.XBOT.FOOT_Y - 2) / 45.6 * (CARRY_ITEM.views?.scale ?? 1);
const CARRY_SIDE = { w: 640, h: 380, cut: 352 };
const CARRY_VIEW = { w: 640, h: 380, cy: 130, palm: 160 };
const carrySide = buildSide({ farLimbs: true, carry: true });
const carryPose = { arm: -12, fore: -58, armFar: -12, foreFar: -58 };
const carryHand = buildHand({ view: "palm", pose: "open", forearm: true });
const CARRY_NEAR = 1.15;
const CARRY_BODY = { w: 640, h: 380, cut: 342 };
const FORE_TOWARD = { rot: 0, sy: 0.04 };
const carryFrontPose = { foreL: FORE_TOWARD, foreR: FORE_TOWARD };
const carryFront = buildFront();
const carryBack = buildBack();
const carryTips = buildHand({ view: "tips", pose: "carry", rest: true });
const carrySpread = () => {
  const [x0, , x1] = window.ENV.viewBox(CARRY_ITEM, "top");
  return Math.max(70, (x1 - x0) * CARRY_K / 2 - 60);
};

function carryItemAt(ctx, view, x, y, k = CARRY_K, dpr = 1) {
  const [x0, , x1] = window.ENV.viewBox(CARRY_ITEM, view);
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  ctx.translate(-(x0 + x1) / 2, 0);
  window.ENV.draw(ctx, CARRY_ITEM, { view, lines: dpr });
  ctx.restore();
}

function clipped(ctx, h, draw) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, CARRY_BODY.w, h);
  ctx.clip();
  draw();
  ctx.restore();
}

function drawCarryFront() {
  const [ctx, dpr] = fitCanvas(document.getElementById("carryFront"), CARRY_BODY.w, CARRY_BODY.h);
  clipped(ctx, CARRY_BODY.cut, () => render(ctx, carryFront, { pal, pose: carryFrontPose, lineW: 1.4 * dpr }));
  const rest = window.XBOT.locate(carryTips, "rest");
  let top = Infinity;
  for (const [hook, mirror] of [["handL", false], ["handR", true]]) {
    const w = window.XBOT.locate(carryFront, hook, carryFrontPose);
    ctx.save();
    ctx.translate(window.XBOT.AX + (mirror ? 1 : -1) * carrySpread(), w.f);
    if (mirror) ctx.scale(-1, 1);
    ctx.translate(-rest.e, -rest.f);
    render(ctx, carryTips, { pal, lineW: 1.4 * dpr });
    ctx.restore();
    top = Math.min(top, w.f);
  }
  carryItemAt(ctx, "side", window.XBOT.AX, top, CARRY_K, dpr);
}

function drawCarryBack() {
  const [ctx, dpr] = fitCanvas(document.getElementById("carryBack"), CARRY_BODY.w, CARRY_BODY.h);
  const w = window.XBOT.locate(carryBack, "handL", carryFrontPose);
  carryItemAt(ctx, "side", window.XBOT.AX, w.f, CARRY_K, dpr);
  clipped(ctx, CARRY_BODY.cut, () => render(ctx, carryBack, { pal, pose: carryFrontPose, lineW: 1.4 * dpr }));
}

function drawCarryTop() {
  const [ctx, dpr] = fitCanvas(document.getElementById("carryTop"), CARRY_BODY.w, CARRY_BODY.h);
  ctx.translate(0, -150);
  const root = buildTop({ forearms: true, spread: carrySpread() });
  render(ctx, root, { pal, lineW: 1.4 * dpr });
  const at = window.XBOT.locate(root, "carry");
  carryItemAt(ctx, "top", at.e, at.f - 30, CARRY_K, dpr);
}

function fitCanvas(c, w, h) {
  const dpr = devicePixelRatio || 1;
  c.width = Math.round(c.clientWidth * dpr);
  c.height = Math.round(c.width * h / w);
  const ctx = c.getContext("2d");
  const s = c.width / w;
  ctx.setTransform(s, 0, 0, s, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return [ctx, dpr];
}

function drawCarrySide() {
  const [ctx, dpr] = fitCanvas(document.getElementById("carrySide"), CARRY_SIDE.w, CARRY_SIDE.h);
  const base = ctx.getTransform();
  const wrist = window.XBOT.locate(carrySide, "hand", carryPose);
  const item = c => {
    c.save();
    c.setTransform(base);
    c.translate(wrist.e + 40, wrist.f - 2);
    c.scale(CARRY_K, CARRY_K);
    window.ENV.draw(c, CARRY_ITEM, { view: "front", lines: dpr });
    c.restore();
  };
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, CARRY_SIDE.w, CARRY_SIDE.cut);
  ctx.clip();
  render(ctx, carrySide, { pal, pose: carryPose, hooks: { hand: item }, lineW: 1.4 * dpr });
  ctx.restore();
}

function drawCarryView() {
  const [ctx, dpr] = fitCanvas(document.getElementById("carryView"), CARRY_VIEW.w, CARRY_VIEW.h);
  const mid = CARRY_VIEW.w / 2;
  const spread = carrySpread();
  for (const side of [-1, 1]) {
    const x = mid + side * spread;
    ctx.save();
    ctx.translate(x, CARRY_VIEW.palm);
    ctx.scale(-side, 1);
    ctx.rotate(Math.PI);
    ctx.scale(-1, 1);
    ctx.translate(-88, -438);
    render(ctx, carryHand, { pal, lineW: 1.4 * dpr });
    ctx.restore();
  }
  carryItemAt(ctx, "top", mid, CARRY_VIEW.cy, CARRY_K * CARRY_NEAR, dpr);
}

function draw() {
  drawHands();
  drawCarrySide();
  drawCarryFront();
  drawCarryBack();
  drawCarryTop();
  drawCarryView();
  for (const [id, root] of Object.entries(views)) {
    const c = document.getElementById(id);
    const dpr = devicePixelRatio || 1;
    const w = c.clientWidth;
    c.width = Math.round(w * dpr);
    c.height = Math.round(w * 780 / 640 * dpr);
    const ctx = c.getContext("2d");
    const s = c.width / 640;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.clearRect(0, 0, 640, 780);
    ctx.save();
    if (mirrored.has(id)) { ctx.translate(640, 0); ctx.scale(-1, 1); }
    render(ctx, root, { pal, lineW: (simple.has(id) ? window.XBOT.GAME_LINE : 1.4) * dpr, simple: simple.has(id) });
    ctx.restore();
    if (opts.guides && !TOP_VIEWS.has(id)) {
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(63,208,224,0.6)";
      ctx.fillStyle = "rgba(63,208,224,0.8)";
      ctx.lineWidth = 1;
      ctx.font = "12px system-ui";
      for (const [name, y] of LEVELS) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(640, y); ctx.stroke();
        ctx.fillText(name, 4, y - 4);
      }
      ctx.setLineDash([]);
    }
  }
}

const palEl = document.getElementById("palette");
for (const k of Object.keys(pal)) {
  const label = document.createElement("label");
  const input = document.createElement("input");
  input.type = "color";
  input.value = pal[k];
  input.oninput = () => { pal[k] = input.value; draw(); };
  label.append(input, k);
  palEl.append(label);
}
document.getElementById("palToggle").onclick = () => document.body.classList.toggle("with-palette");
document.getElementById("copyPal").onclick = () => navigator.clipboard.writeText(JSON.stringify(pal, null, 2));
document.getElementById("guides").onchange = e => { opts.guides = e.target.checked; draw(); };
addEventListener("resize", draw);
draw();
</script>
<script src="pickup.js"></script>
<script src="../shared/url-state.js"></script>
</body>
</html>
