<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Design Sheet</title>
<style>
  :root { --bg: #0b1112; --panel: #141c1e; --text: #c9d1d0; --muted: #7d8a89; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header button { background: #22302f; color: var(--text); border: 1px solid #2f3f3e; border-radius: 4px; padding: 4px 10px; cursor: pointer; }
  header label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding: 12px 16px; }
  figure { margin: 0; background: #10181a; border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  figcaption { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  figure canvas { width: 100%; aspect-ratio: 640 / 780; display: block; }
  main.game { grid-template-columns: repeat(auto-fill, 144px); }
  main.game canvas { width: 128px; }
  h2 { font-size: 13px; font-weight: 600; margin: 4px 16px 0; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  figure img { width: 100%; height: auto; display: block; border-radius: 4px; image-rendering: pixelated; }
  #refs { padding: 0 16px 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  #palette { display: none; flex-wrap: wrap; gap: 6px 14px; padding: 8px 16px; background: var(--panel); }
  body.with-palette #palette { display: flex; }
  #palette label { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  #palette input { width: 28px; height: 20px; border: 0; padding: 0; background: none; }
</style>
</head>
<body>
<header>
  <h1>X-BOT design sheet</h1>
  <button id="palToggle">Palette</button>
  <button id="copyPal">Copy palette JSON</button>
  <label><input id="lines" type="checkbox" checked> Outlines</label>
  <label><input id="guides" type="checkbox" checked> Level guides</label>
</header>
<div id="palette"></div>
<main>
  <figure><figcaption>Front</figcaption><canvas id="front"></canvas></figure>
  <figure><figcaption>Side, facing right (robot's right side)</figcaption><canvas id="side"></canvas></figure>
  <figure><figcaption>Side, facing left (robot's left side)</figcaption><canvas id="sideLeft"></canvas></figure>
  <figure><figcaption>Back</figcaption><canvas id="back"></canvas></figure>
</main>
<h2>In-game, simplified (game size, scale 0.2)</h2>
<main class="game">
  <figure><figcaption>Front</figcaption><canvas id="gFront"></canvas></figure>
  <figure><figcaption>Side, facing right</figcaption><canvas id="gSide"></canvas></figure>
  <figure><figcaption>Side, facing left</figcaption><canvas id="gSideLeft"></canvas></figure>
  <figure><figcaption>Back</figcaption><canvas id="gBack"></canvas></figure>
</main>
<!-- originals -->
<section id="refs">
  <figure><figcaption>Box cover</figcaption><img src="../../docs/research/robot/hires/archive_msdos_00cover.jpg" alt="box cover"></figure>
  <figure><figcaption>Front, VSTUP</figcaption><img src="../../docs/research/robot/cutscenes/VSTUP_f100_front.png" alt="front"></figure>
  <figure><figcaption>Front, SKALA3</figcaption><img src="../../docs/research/robot/cutscenes/SKALA3_f081_front.png" alt="front walking"></figure>
  <figure><figcaption>Side, METROPAC</figcaption><img src="../../docs/research/robot/cutscenes/METROPAC_f028_side.png" alt="side"></figure>
  <figure><figcaption>Back, METROPAC</figcaption><img src="../../docs/research/robot/cutscenes/METROPAC_f044_back.png" alt="back"></figure>
  <figure><figcaption>Back, POUZDRAT</figcaption><img src="../../docs/research/robot/cutscenes/POUZDRAT_f030_back.png" alt="back"></figure>
</section>
<!-- /originals -->
<script src="../shared/config.js"></script>
<script src="../shared/xbot.js"></script>
<script>
const { PALETTE, LEVELS, buildFront, buildSide, buildBack, render } = window.XBOT;

const pal = { ...PALETTE };
const views = { front: buildFront(), side: buildSide(), sideLeft: buildSide({ badge: true }), back: buildBack() };
const gameViews = { gFront: buildFront({ lod: true }), gSide: buildSide({ farLimbs: true, lod: true }), gSideLeft: buildSide({ farLimbs: true, badge: true, lod: true }), gBack: buildBack({ lod: true }) };
const simple = new Set(Object.keys(gameViews));
Object.assign(views, gameViews);
const mirrored = new Set(["sideLeft", "gSideLeft"]);
const opts = { lines: true, guides: true };

function draw() {
  for (const [id, root] of Object.entries(views)) {
    const c = document.getElementById(id);
    const dpr = devicePixelRatio || 1;
    const w = c.clientWidth;
    c.width = Math.round(w * dpr);
    c.height = Math.round(w * 780 / 640 * dpr);
    const ctx = c.getContext("2d");
    const s = c.width / 640;
    ctx.setTransform(s, 0, 0, s, 0, 0);
    ctx.clearRect(0, 0, 640, 780);
    ctx.save();
    if (mirrored.has(id)) { ctx.translate(640, 0); ctx.scale(-1, 1); }
    render(ctx, root, { pal, lineW: opts.lines ? (simple.has(id) ? 1 : 1.4) * dpr : 0, simple: simple.has(id) });
    ctx.restore();
    if (opts.guides) {
      ctx.setLineDash([6, 6]);
      ctx.strokeStyle = "rgba(63,208,224,0.6)";
      ctx.fillStyle = "rgba(63,208,224,0.8)";
      ctx.lineWidth = 1;
      ctx.font = "12px system-ui";
      for (const [name, y] of LEVELS) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(640, y); ctx.stroke();
        ctx.fillText(name, 4, y - 4);
      }
      ctx.setLineDash([]);
    }
  }
}

const palEl = document.getElementById("palette");
for (const k of Object.keys(pal)) {
  const label = document.createElement("label");
  const input = document.createElement("input");
  input.type = "color";
  input.value = pal[k];
  input.oninput = () => { pal[k] = input.value; draw(); };
  label.append(input, k);
  palEl.append(label);
}
document.getElementById("palToggle").onclick = () => document.body.classList.toggle("with-palette");
document.getElementById("copyPal").onclick = () => navigator.clipboard.writeText(JSON.stringify(pal, null, 2));
document.getElementById("lines").onchange = e => { opts.lines = e.target.checked; draw(); };
document.getElementById("guides").onchange = e => { opts.guides = e.target.checked; draw(); };
addEventListener("resize", draw);
draw();
</script>
</body>
</html>
